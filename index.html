<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>STRATA — Conceptual geotech for the FE & PE</title>
  <meta name="theme-color" content="#c24e1d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="STRATA" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <style>




:root {
  --paper: #f3eee4;
  --paper-2: #e8e0d2;
  --card: #fffaf2;
  --ink: #1b1712;
  --ink-soft: #5c5348;
  --line: #d9cfbf;
  --clay: #c24e1d;
  --clay-deep: #9a3914;
  --ochre: #c99212;
  --moss: #2f6a4a;
  --moss-deep: #1e4a34;
  --water: #2a6a78;
  --sand: #c6a36e;
  --heart: #c43c3c;
  --locked: #b3aa9c;
  --shadow: 0 18px 40px rgba(40, 28, 12, 0.10);
  --radius: 22px;
  --font-display: "Fraunces", "Times New Roman", serif;
  --font-body: "Source Sans 3", "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { min-height: 100%; }
body {
  font-family: var(--font-body);
  color: var(--ink);
  background:
    radial-gradient(1200px 500px at 10% -10%, rgba(194, 78, 29, 0.08), transparent 50%),
    radial-gradient(900px 400px at 100% 0%, rgba(42, 106, 120, 0.08), transparent 45%),
    var(--paper);
  letter-spacing: 0.01em;
}

button { font-family: inherit; cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: 0.55; }

.app {
  max-width: 760px;
  margin: 0 auto;
  min-height: 100vh;
  padding: 0 18px 80px;
  position: relative;
}

.strata-bg {
  position: fixed;
  inset: auto 0 0 0;
  height: 88px;
  pointer-events: none;
  background:
    linear-gradient(180deg, transparent, rgba(27,23,18,0.04)),
    repeating-linear-gradient(180deg,
      #d7c4a3 0 14px,
      #c9a87a 14px 26px,
      #b0895a 26px 36px,
      #8f5d38 36px 48px,
      #6d4328 48px 62px,
      #4a2e1c 62px 88px);
  opacity: 0.35;
}

/* Header */
.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 14px 0 12px;
  background: linear-gradient(180deg, var(--paper) 70%, transparent);
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  background: none;
  border: 0;
  color: inherit;
}
.core-logo {
  width: 36px;
  height: 36px;
}
.brand-name {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 22px;
  letter-spacing: -0.03em;
  line-height: 1;
}
.brand-name span { color: var(--clay); }
.brand-sub {
  display: block;
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-soft);
  margin-top: 2px;
}
.stats {
  display: flex;
  gap: 8px;
}
.stat {
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 6px 10px;
  font-weight: 650;
  font-size: 14px;
  box-shadow: 0 1px 0 rgba(255,255,255,0.7) inset;
}
.stat.hearts { color: var(--heart); }
.stat.streak { color: var(--clay); }
.stat.xp { color: var(--water); }

/* Screens */
.screen { display: none; animation: rise 0.35s ease; }
.screen.active { display: block; }
@keyframes rise {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: none; }
}

/* Splash */
.splash {
  padding: 36px 0 20px;
  text-align: left;
}
.kicker {
  font-size: 12px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--clay);
  font-weight: 700;
}
.splash h1 {
  font-family: var(--font-display);
  font-size: clamp(36px, 8vw, 58px);
  line-height: 0.95;
  letter-spacing: -0.04em;
  margin: 10px 0 16px;
  font-weight: 600;
}
.splash p.lede {
  font-size: 18px;
  color: var(--ink-soft);
  max-width: 34em;
  line-height: 1.45;
}
.pill-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 22px 0 28px; }
.pill {
  border: 1px solid var(--line);
  background: var(--card);
  border-radius: 999px;
  padding: 7px 12px;
  font-size: 13px;
  color: var(--ink-soft);
}
.cta-row { display: flex; flex-wrap: wrap; gap: 10px; }
.btn {
  border: 0;
  border-radius: 16px;
  padding: 14px 18px;
  font-weight: 700;
  font-size: 16px;
}
.btn-primary {
  background: var(--clay);
  color: #fffaf2;
  box-shadow: 0 8px 0 var(--clay-deep);
}
.btn-primary:active { transform: translateY(2px); box-shadow: 0 6px 0 var(--clay-deep); }
.btn-ghost {
  background: transparent;
  border: 1.5px solid var(--ink);
  color: var(--ink);
}
.fineprint {
  margin-top: 18px;
  font-size: 12px;
  color: var(--ink-soft);
  max-width: 40em;
}

/* Home path */
.unit {
  margin: 10px 0 34px;
}
.unit-head {
  display: flex;
  justify-content: space-between;
  align-items: end;
  gap: 12px;
  margin-bottom: 8px;
}
.unit-head h2 {
  font-family: var(--font-display);
  font-size: 28px;
  letter-spacing: -0.03em;
  font-weight: 600;
}
.unit-head p { color: var(--ink-soft); font-size: 14px; max-width: 28em; }
.progress-chip {
  font-size: 12px;
  font-weight: 700;
  background: #efe4cf;
  border-radius: 999px;
  padding: 6px 10px;
  white-space: nowrap;
}

.path {
  position: relative;
  padding: 18px 0 8px;
}
.path::before {
  content: "";
  position: absolute;
  left: 36px;
  top: 20px;
  bottom: 20px;
  width: 4px;
  border-radius: 4px;
  background: repeating-linear-gradient(
    180deg,
    var(--sand),
    var(--sand) 10px,
    var(--line) 10px,
    var(--line) 18px
  );
}
.lesson-node {
  position: relative;
  display: grid;
  grid-template-columns: 76px 1fr;
  gap: 8px;
  align-items: center;
  margin: 14px 0;
  background: none;
  border: 0;
  text-align: left;
  width: 100%;
  color: inherit;
}
.lesson-node:nth-child(even) { padding-left: 28px; }
.node-orb {
  width: 72px;
  height: 72px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 22px;
  background: var(--card);
  border: 3px solid var(--line);
  box-shadow: var(--shadow);
  position: relative;
  z-index: 1;
}
.lesson-node.done .node-orb {
  background: var(--moss);
  border-color: var(--moss-deep);
  color: #f3eee4;
}
.lesson-node.current .node-orb {
  background: var(--clay);
  border-color: var(--clay-deep);
  color: #fff;
  animation: pulse 1.8s ease infinite;
}
.lesson-node.locked .node-orb {
  background: #ece5d8;
  color: var(--locked);
}
@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(194,78,29,0.35); }
  50% { box-shadow: 0 0 0 10px rgba(194,78,29,0); }
}
.node-copy {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 12px 14px;
  box-shadow: var(--shadow);
}
.node-copy h3 { font-size: 17px; font-weight: 750; }
.node-copy p { font-size: 13px; color: var(--ink-soft); margin-top: 3px; }
.node-meta {
  margin-top: 6px;
  font-size: 12px;
  font-weight: 700;
  color: var(--clay);
}

.home-extra {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 8px;
}
.panel {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px;
  box-shadow: var(--shadow);
}
.panel h3 { font-family: var(--font-display); font-size: 20px; margin-bottom: 6px; }
.panel p { color: var(--ink-soft); font-size: 14px; line-height: 1.4; }
.panel .btn { margin-top: 12px; width: 100%; }

/* Lesson */
.lesson-top {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 0 14px;
}
.back-btn, .icon-btn {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: var(--card);
  font-size: 18px;
}
.track {
  flex: 1;
  height: 10px;
  background: #e5d9c6;
  border-radius: 99px;
  overflow: hidden;
}
.track > span {
  display: block;
  height: 100%;
  width: 0;
  background: linear-gradient(90deg, var(--ochre), var(--clay));
  border-radius: 99px;
  transition: width 0.25s ease;
}

.prompt-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 24px;
  padding: 22px 20px 18px;
  box-shadow: var(--shadow);
}
.q-label {
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--water);
  font-weight: 700;
}
.prompt-card h2 {
  font-size: 22px;
  line-height: 1.3;
  margin: 8px 0 14px;
  font-weight: 650;
}
.prompt-card h2 em, .var {
  font-style: italic;
  font-family: var(--font-display);
}
.vignette {
  background: #fff7e8;
  border: 2px solid #c99212;
  border-left: 8px solid #c24e1d;
  padding: 14px 16px 16px;
  border-radius: 14px;
  color: #1b1712;
  margin: 12px 0 18px;
  font-size: 18px;
  line-height: 1.45;
  font-weight: 600;
  box-shadow: 0 6px 0 rgba(194, 78, 29, 0.12);
}
.vignette-label {
  display: block;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: #c24e1d;
  margin-bottom: 6px;
}
.diagram {
  background: #fff8ee;
  border: 2px solid #cbb896;
  border-radius: 16px;
  padding: 10px 10px 8px;
  margin: 0 0 16px;
  overflow: hidden;
}
.diagram-label {
  display: block;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: #8f5d38;
  margin-bottom: 6px;
}
.diagram svg { width: 100%; max-height: 240px; height: auto; display: block; }

.choices { display: grid; gap: 10px; }
.choice {
  text-align: left;
  border: 2px solid var(--line);
  background: #fff;
  border-radius: 16px;
  padding: 12px 14px;
  font-size: 16px;
  color: var(--ink);
  transition: border-color 0.15s, transform 0.12s, background 0.15s;
}
.choice:hover { border-color: var(--ink); }
.choice.selected { border-color: var(--clay); background: #fbeee6; }
.choice.correct { border-color: var(--moss); background: #e8f4ec; }
.choice.wrong { border-color: var(--heart); background: #fdecec; }
.choice-key {
  display: inline-grid;
  place-items: center;
  width: 22px;
  height: 22px;
  border-radius: 6px;
  background: #efe6d6;
  font-size: 12px;
  font-weight: 800;
  margin-right: 8px;
}

.check-wrap { margin-top: 16px; }
.check-wrap .btn { width: 100%; }

/* Feedback sheet */
.sheet {
  position: fixed;
  left: 50%;
  transform: translateX(-50%) translateY(120%);
  bottom: 0;
  width: min(760px, 100%);
  background: var(--card);
  border-top: 1px solid var(--line);
  border-radius: 24px 24px 0 0;
  padding: 18px 20px 24px;
  box-shadow: 0 -12px 40px rgba(0,0,0,0.12);
  transition: transform 0.28s ease;
  z-index: 30;
}
.sheet.open { transform: translateX(-50%) translateY(0); }
.sheet.good { background: #eef7f0; }
.sheet.bad { background: #fdf2f0; }
.sheet h3 { font-family: var(--font-display); font-size: 26px; margin-bottom: 6px; }
.sheet p { font-size: 15px; line-height: 1.45; color: var(--ink); }
.sheet .why { margin-top: 8px; color: var(--ink-soft); }
.fepe {
  margin-top: 10px;
  font-size: 13px;
  background: rgba(255,255,255,0.7);
  border-radius: 12px;
  padding: 8px 10px;
  color: var(--water);
  font-weight: 600;
}

/* Complete */
.complete {
  text-align: center;
  padding: 28px 8px;
}
.complete .medal {
  width: 92px;
  height: 92px;
  margin: 0 auto 12px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: var(--ochre);
  color: #1b1712;
  font-size: 40px;
  box-shadow: 0 10px 0 #9a7010;
}
.complete h2 {
  font-family: var(--font-display);
  font-size: 40px;
  letter-spacing: -0.03em;
}
.xp-burst {
  font-size: 28px;
  font-weight: 800;
  color: var(--clay);
  margin: 8px 0 18px;
}
.recap {
  text-align: left;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 14px;
  margin: 16px 0;
}
.recap li { margin: 6px 0 6px 18px; color: var(--ink-soft); }

/* Review / reference */
.item-list { display: grid; gap: 10px; }
.miss-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 12px 14px;
}
.miss-card strong { display: block; margin-bottom: 4px; }
.ref-grid { display: grid; gap: 12px; }
.ref-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 16px;
}
.ref-card h3 { font-family: var(--font-display); font-size: 22px; margin-bottom: 6px; }
.ref-card ul { padding-left: 18px; color: var(--ink-soft); }
.ref-card li { margin: 6px 0; }

.var-table { width: 100%; border-collapse: collapse; margin-top: 8px; }
.var-table th, .var-table td {
  text-align: left; vertical-align: top;
  padding: 10px 8px; border-bottom: 1px solid var(--line);
  font-size: 14px; line-height: 1.35;
}
.var-table th { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-soft); }
.var-table .sym {
  font-family: var(--font-mono);
  font-weight: 700;
  white-space: nowrap;
  color: var(--clay-deep);
  width: 28%;
}
.var-table .nm { font-weight: 700; color: var(--ink); display: block; margin-bottom: 2px; }
.var-table .df { color: var(--ink-soft); }
.ref-card.symbols { padding: 16px 12px 8px; }

.eq {
  font-family: var(--font-mono);
  background: #f3eadb;
  padding: 2px 6px;
  border-radius: 6px;
}

.toast {
  position: fixed;
  left: 50%;
  bottom: 24px;
  transform: translateX(-50%) translateY(20px);
  background: var(--ink);
  color: #f3eee4;
  padding: 10px 14px;
  border-radius: 12px;
  opacity: 0;
  pointer-events: none;
  transition: 0.25s ease;
  z-index: 50;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.out-of-hearts {
  text-align: center;
  padding: 40px 10px;
}
.out-of-hearts h2 { font-family: var(--font-display); font-size: 34px; }


html { -webkit-text-size-adjust: 100%; }
body {
  padding-bottom: env(safe-area-inset-bottom);
}
.app {
  padding-left: max(18px, env(safe-area-inset-left));
  padding-right: max(18px, env(safe-area-inset-right));
  padding-bottom: calc(80px + env(safe-area-inset-bottom));
}
.topbar {
  padding-top: max(14px, env(safe-area-inset-top));
}
.choice, .btn, .lesson-node, .back-btn {
  min-height: 48px;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
.sheet {
  padding-bottom: calc(24px + env(safe-area-inset-bottom));
}
@media (max-width: 560px) {
  .home-extra { grid-template-columns: 1fr; }
  .splash h1 { font-size: 36px; }
  .stats { gap: 6px; }
  .stat { padding: 6px 8px; }
  .stat span.label { display: none; }
  .prompt-card { padding: 18px 14px 16px; }
  .prompt-card h2 { font-size: 20px; }
  .vignette { font-size: 17px; }
  .choice { font-size: 15px; }
  .brand-sub { display: none; }
  .path::before { left: 32px; }
  .node-orb { width: 64px; height: 64px; }
  .lesson-node { grid-template-columns: 64px 1fr; }
}


  
.bench-banner {
  margin: 28px 0 8px;
  padding: 18px 16px;
  background: #1b1712;
  color: #f3eee4;
  border-radius: 22px;
}
.bench-banner .kicker { color: #e0a36a; }
.bench-banner h2 {
  font-family: var(--font-display);
  font-size: 28px;
  letter-spacing: -0.03em;
  margin: 6px 0 8px;
}
.bench-banner p { color: #d9d0c4; font-size: 15px; max-width: 38em; line-height: 1.4; }
.bench-unit .node-orb { border-color: #1b1712; }
.given {
  font-family: var(--font-mono);
  font-size: 13px;
  background: #efe6d4;
  border-radius: 10px;
  padding: 8px 10px;
  margin: 0 0 12px;
  color: #3d3428;
}
.work {
  margin: 10px 0 6px 18px;
  color: var(--ink);
  font-size: 14px;
}
.work li { margin: 4px 0; }

  
  
  
.two-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.gear { width: 36px; height: 36px; border-radius: 10px; }
.tutor { padding: 8px 0 24px; }
.tutor-head { display: flex; justify-content: space-between; gap: 12px; align-items: start; margin-bottom: 12px; }
.tutor-head h1 { font-family: var(--font-display); font-size: 32px; letter-spacing: -0.03em; }
.tutor-item {
  background: #fff7e8;
  border: 2px solid #c99212;
  border-left: 8px solid #c24e1d;
  border-radius: 14px;
  padding: 12px 14px;
  margin-bottom: 12px;
}
.tutor-item strong { display: block; margin-bottom: 6px; }
.tutor-item span { color: var(--ink-soft); font-size: 14px; }
.tutor-log {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 12px;
  min-height: 180px;
  max-height: 42vh;
  overflow: auto;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.bubble {
  padding: 10px 12px;
  border-radius: 14px;
  font-size: 15px;
  line-height: 1.45;
  max-width: 95%;
}
.bubble.user { align-self: flex-end; background: #f3d7c6; }
.bubble.assistant { align-self: flex-start; background: #efe6d4; }
.chip-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
.chip { cursor: pointer; background: var(--card); }
.tutor-form { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin: 8px 0; }
.tutor-form input, .settings-input {
  border: 2px solid var(--line);
  border-radius: 14px;
  padding: 12px 14px;
  font: inherit;
  font-size: 16px;
  background: #fff;
}
.settings-label { display: block; font-weight: 700; margin: 18px 0 6px; }
@media (max-width: 560px) {
  .two-btns { grid-template-columns: 1fr; }
  .tutor-head { flex-direction: column; }
}

  </style>
</head>
<body>
  <div class="strata-bg" aria-hidden="true"></div>
  <div class="app" id="app"></div>
  <div class="toast" id="toast" role="status"></div>
  <script>




window.STRATA_CONTENT = {
  appName: "STRATA",
  tagline: "See what the soil will do.",
  units: [
    {
      id: "effective-stress",
      title: "Effective stress",
      blurb: "The spine of every geotech item on the FE and PE. Strength, settlement, and seepage all start here.",
      lessons: [
        {
          id: "es-1",
          title: "Three stresses",
          minutes: 5,
          xp: 20,
          summary: "Total stress is the weight above you. Pore pressure is the water. The skeleton only feels the difference.",
          items: [
            {
              id: "es-1-a",
              type: "mcq",
              label: "Definition",
              stem: "At a point in saturated soil, which quantity is carried by the grain-to-grain contacts?",
              choices: [
                { id: "a", text: "Total vertical stress, σ" },
                { id: "b", text: "Pore-water pressure, u", },
                { id: "c", text: "Effective stress, σ′", correct: true },
                { id: "d", text: "The sum of σ and u" }
              ],

(function () {
  const C = window.STRATA_CONTENT;
  const KEY = "strata-fepe-v1";
  const MAX_HEARTS = 5;
  const HEART_MS = 20 * 60 * 1000;

  const $ = (sel) => document.querySelector(sel);
  const app = $("#app");

  const defaultState = () => ({
    xp: 0,
    hearts: MAX_HEARTS,
    heartTs: Date.now(),
    streak: 0,
    lastActive: null,
    completed: [],
    missed: [],
    seenSplash: false,
    name: "",
    xaiKey: ""
  });

  let state = load();
  let session = null;

  function load() {
    try {
      return { ...defaultState(), ...JSON.parse(localStorage.getItem(KEY) || "{}") };
    } catch {
      return defaultState();
    }
  }
  function save() {
    localStorage.setItem(KEY, JSON.stringify(state));
  }

  function regenerateHearts() {
    if (state.hearts >= MAX_HEARTS) {
      state.heartTs = Date.now();
      return;
    }
    const gained = Math.floor((Date.now() - state.heartTs) / HEART_MS);
    if (gained > 0) {
      state.hearts = Math.min(MAX_HEARTS, state.hearts + gained);
      state.heartTs += gained * HEART_MS;
      save();
    }
  }

  function todayStr(d = new Date()) {
    return d.toISOString().slice(0, 10);
  }
  function bumpStreak() {
    const t = todayStr();
    if (state.lastActive === t) return false;
    const y = new Date();
    y.setDate(y.getDate() - 1);
    if (state.lastActive === todayStr(y)) state.streak += 1;
    else state.streak = 1;
    state.lastActive = t;
    save();
    return true;
  }

  function flattenUnits(units) {
    const out = [];
    units.forEach((u) =>
      u.lessons.forEach((l) =>
        out.push({ ...l, unitId: u.id, unitTitle: u.title, bench: !!u.bench })
      )
    );
    return out;
  }
  function allLessons() {
    return flattenUnits(C.units);
  }
  function pathLessons() {
    return flattenUnits(C.units.filter((u) => !u.bench));
  }
  function lessonById(id) {
    return allLessons().find((l) => l.id === id);
  }
  function isUnlocked(lesson, index, list) {
    if (lesson && lesson.bench) return true;
    const row = list || pathLessons();
    if (index === 0) return true;
    return state.completed.includes(row[index - 1].id);
  }
  function unitProgress(unit) {
    const done = unit.lessons.filter((l) => state.completed.includes(l.id)).length;
    return { done, total: unit.lessons.length };
  }

  function toast(msg) {
    const el = $("#toast");
    el.textContent = msg;
    el.classList.add("show");
    setTimeout(() => el.classList.remove("show"), 2200);
  }

  function renderTop(extra = "") {
    regenerateHearts();
    return `

            <rect x="12" y="3" width="12" height="30" rx="3" fill="#c6a36e" stroke="#1b1712" stroke-width="1.2"/>
            <rect x="12" y="7" width="12" height="5" fill="#d7c4a3"/>
            <rect x="12" y="16" width="12" height="4" fill="#8f5d38"/>
            <rect x="12" y="24" width="12" height="5" fill="#4a2e1c"/>

          </span>

          <div class="stat hearts" title="Hearts">❤ <span>${state.hearts}</span></div>

  function startLesson(id) {

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function startMixed() {
    const picked = [];
    pathLessons().forEach((lesson) => {
      const pool = shuffle(lesson.items || []);

    });
    if (!picked.length) return renderHome();
    session = {
      lesson: {
        id: "mixed-concepts",
        title: "All-concept check",
        xp: 36,
        items: shuffle(picked),
        summary: "Two items from every conceptual lesson. Hearts are off so you can finish the set."
      },
      index: 0,
      correct: 0,
      answers: [],
      reviewMode: true,
      examMode: true

  function renderOutOfHearts() {
    const mins = Math.max(1, Math.ceil((HEART_MS - ((Date.now() - state.heartTs) % HEART_MS)) / 60000));
    show("hearts", `
      ${renderTop()}

  function grade(choiceId) {
    const item = session.lesson.items[session.index];
    const chosen = item.choices.find((c) => c.id === choiceId);
    const correctChoice = item.choices.find((c) => c.correct);
    const ok = !!(chosen && chosen.correct);
    session.locked = true;
    session.answers.push({ id: item.id, ok });
    if (ok) session.correct += 1;
    else {
      if (!session.examMode) state.hearts = Math.max(0, state.hearts - 1);
      if (!state.missed.includes(item.id)) state.missed.push(item.id);
      save();
    }
    if (ok && session.reviewMode) {
      state.missed = state.missed.filter((id) => id !== item.id);
      save();
    }

    app.querySelectorAll(".choice").forEach((b) => {
      const id = b.getAttribute("data-choice");
      if (id === correctChoice.id) b.classList.add("correct");
      if (id === choiceId && !ok) b.classList.add("wrong");
    });

    const sheet = $("#sheet");
    sheet.className = "sheet open " + (ok ? "good" : "bad");

  function itemPack(item) {
    const correct = (item.choices || []).find((c) => c.correct) || {};
    const letters = { a: "A", b: "B", c: "C", d: "D", e: "E" };
    return {
      stem: item.stem || "",
      vignette: item.vignette || "",
      given: item.given || "",
      explanation: item.explanation || "",
      miss: item.miss || "",
      work: item.work || [],
      fepe: item.fepe || "",
      correctText: correct.text || "",
      correctId: letters[correct.id] || "",
      choices: (item.choices || []).map((c) => `${letters[c.id] || c.id}. ${c.text}${c.correct ? "  [correct]" : ""}`)
    };
  }

  function localTutor(question, item, pickedId, wasRight) {
    const p = itemPack(item);
    const q = (question || "").toLowerCase();
    const bits = [];
    const letterHit = q.match(/\b([abcd])\b/);
    const whyWrong = /why not|what.?s wrong|incorrect|trap|distractor|instead/.test(q);
    const whatIf = /what if|suppose|if the|change|instead of|higher|lower|raise|lower the wt|water table/.test(q);
    const units = /unit|psf|pcf|lb\/ft|convert|γw|62\.4/.test(q);
    const principle = /effective|pore|total stress|drained|undrained|ka|k0|kp|gradient|consol|settlement|bearing/.test(q);

    bits.push(wasRight
      ? `You marked this correctly. The keyed answer is ${p.correctId}: ${p.correctText}.`
      : `The keyed answer is ${p.correctId}: ${p.correctText}.`);

    if (letterHit) {
      const ch = (item.choices || []).find((c) => c.id === letterHit[1]);
      if (ch && !ch.correct) {
        bits.push(`Choice ${letterHit[1].toUpperCase()} (“${ch.text}”) is a distractor. ${p.miss || "It usually comes from stopping one step early — total stress, pore pressure alone, or the wrong coefficient."}`);
      } else if (ch && ch.correct) {
        bits.push(`Choice ${letterHit[1].toUpperCase()} is the keyed answer. ${p.explanation}`);
      }
    } else if (whyWrong) {
      bits.push(p.miss || "The wrong options are usually the intermediate numbers: σ before subtracting u, u by itself, or a coefficient that does not match the wall or drainage case.");
    }

    if (p.work && p.work.length) {
      bits.push("Work for this item:\n" + p.work.map((s, i) => `${i + 1}. ${s}`).join("\n"));
    }

    if (units) {
      bits.push("On the PE Civil, keep γw = 62.4 pcf unless the stem gives another value. Stresses land in psf (or ksf). Wall thrusts are lb per foot of wall. Consolidation settlements are often asked in inches — multiply feet by 12.");
    }

    if (whatIf) {
      bits.push("A ‘what if’ does not change the keyed answer, but the same machine still applies: layer total stress, compute u from the actual head (not automatically from the ground surface), then σ′ = σ − u. Raising the water table raises u more than it raises σ, so σ′ falls. Switching a non-yielding wall from Ka to K0 increases thrust. Flooding a silt trench kills suction, not true c′.");
    }

    if (principle && !whyWrong) {
      bits.push("Principles this family of items keeps using: σ′ = σ − u; below a hydrostatic WT, σ′ gains at γ′ = γsat − γw; drained strength uses c′, φ′; short-term saturated clay uses su; Ka < K0 < Kp; water on a wall is ½γw h² and is not multiplied by Ka; ic = (Gs − 1)/(1 + e); primary consolidation uses log10.");
    }

    bits.push("On this exact item: " + p.explanation);
    if (p.fepe) bits.push(p.fepe);
    bits.push("I can only be certain about this item’s given numbers. If you want a new numerical example, say the new water-table depth or height and we can reuse the same setup.");
    return bits.join("\n\n");
  }

  function tutorSystemPrompt(item, pickedId, wasRight) {
    const p = itemPack(item);
    return [
      "You are a geotechnical tutor inside STRATA, a Civil FE/PE study app.",
      "Stay on THIS item unless the user clearly asks for a variation. Do not invent NCEES affiliation or claim this is a past exam question.",
      "If you do arithmetic, show steps. Prefer US customary units (psf, pcf, ft) unless the user switches.",
      "If unsure, say so. Do not change the keyed answer.",
      "Item stem: " + p.stem,
      p.vignette ? "Scenario: " + p.vignette : "",
      p.given ? "Given: " + p.given : "",
      "Choices:\n" + p.choices.join("\n"),
      "Keyed answer: " + p.correctId + " — " + p.correctText,
      "Learner picked " + String(pickedId || "").toUpperCase() + " (" + (wasRight ? "correct" : "incorrect") + ").",
      "Official explanation: " + p.explanation,
      p.work.length ? "Worked steps:\n- " + p.work.join("\n- ") : "",
      p.miss ? "Common miss: " + p.miss : "",
      p.fepe ? "Exam note: " + p.fepe : ""
    ].filter(Boolean).join("\n");
  }

  async function askTutor(question) {
    const item = session.tutorItem;
    const log = session.tutorChat || [];
    if (state.xaiKey && location.protocol.startsWith("http")) {
      try {
        const messages = [
          { role: "system", content: tutorSystemPrompt(item, session.tutorChoice, session.tutorOk) },
          ...log.map((m) => ({ role: m.role, content: m.text })),
          { role: "user", content: question }
        ];
        const res = await fetch("https://api.x.ai/v1/chat/completions", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: "Bearer " + state.xaiKey
          },
          body: JSON.stringify({
            model: "grok-4.6",
            messages,
            temperature: 0.2
          })
        });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        const text = data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
        if (text) return { text, source: "grok" };
        throw new Error("empty");
      } catch (err) {
        return {
          text: localTutor(question, item, session.tutorChoice, session.tutorOk) +
            "\n\n(Live Grok did not respond from this page — " + err.message +
            ". Using the on-item tutor. Host the app over https and check the key in Settings.)",
          source: "local"
        };
      }
    }
    return {
      text: localTutor(question, item, session.tutorChoice, session.tutorOk),
      source: state.xaiKey ? "local" : "local"
    };
  }

  function renderTutor() {
    if (!session || !session.tutorItem) return renderHome();
    const item = session.tutorItem;
    const p = itemPack(item);
    const chat = session.tutorChat || [];
    const live = !!(state.xaiKey && location.protocol.startsWith("http"));
    const chips = [
      "Why is the keyed answer right?",
      "Why are the other choices wrong?",
      "What if the water table rises?",
      "Walk through the units."
    ];
    show("tutor", `
      ${renderTop()}
      <section class="tutor">
        <div class="tutor-head">
          <div>
            <div class="kicker">${live ? "Grok on this item" : "Discuss this item"}</div>
            <h1>Ask a follow-up</h1>
          </div>
          <button class="btn btn-ghost" id="back-item" type="button">Back to answer</button>
        </div>
        <div class="tutor-item">
          <strong>${p.stem}</strong>
          <span>Keyed: ${p.correctId}. ${p.correctText}</span>
        </div>
        <div class="tutor-log" id="tutor-log">
          ${chat.length ? chat.map((m) => `<div class="bubble ${m.role}">${escapeHtml(m.text)}</div>`).join("") : `<div class="bubble assistant">Ask about this item. I will stay on these numbers and the keyed solution.${live ? "" : " This is the on-item tutor — add an xAI API key in Settings and host the app on https to talk to Grok live."}</div>`}
        </div>
        <div class="chip-row" id="chips">
          ${chips.map((c) => `<button type="button" class="pill chip" data-q="${escapeAttr(c)}">${c}</button>`).join("")}
        </div>
        <form class="tutor-form" id="tutor-form">
          <input id="tutor-q" type="text" maxlength="400" placeholder="Ask why, or change one assumption…" autocomplete="off" />
          <button class="btn btn-primary" type="submit">Send</button>
        </form>
        <button class="btn btn-ghost" id="copy-prompt" type="button">Copy prompt for Grok</button>
      </section>
    `);
    const logEl = $("#tutor-log");
    function paint() {
      logEl.innerHTML = (session.tutorChat || []).map((m) => `<div class="bubble ${m.role}">${escapeHtml(m.text)}</div>`).join("");
      logEl.scrollTop = logEl.scrollHeight;
    }
    async function send(text) {
      const q = (text || "").trim();
      if (!q) return;
      session.tutorChat = session.tutorChat || [];
      session.tutorChat.push({ role: "user", text: q });
      paint();
      const reply = await askTutor(q);
      session.tutorChat.push({ role: "assistant", text: reply.text });
      paint();
    }
    $("#tutor-form").addEventListener("submit", (e) => {
      e.preventDefault();
      const box = $("#tutor-q");
      const val = box.value;
      box.value = "";
      send(val);
    });
    app.querySelectorAll("[data-q]").forEach((b) => b.addEventListener("click", () => send(b.getAttribute("data-q"))));
    $("#back-item").addEventListener("click", () => {
      renderQuestion();
      // re-grade visually? session.locked still true but question resets selection.
      // Better return to a recap sheet. Re-call grade path is messy.
      // Show explanation sheet again by going through a slim recap.
      showItemRecap();
    });
    $("#copy-prompt").addEventListener("click", () => {
      const blob = tutorSystemPrompt(item, session.tutorChoice, session.tutorOk) +
        "\n\nLearner question: " + ((session.tutorChat || []).filter((m) => m.role === "user").slice(-1)[0] || { text: "Explain this item." }).text;
      navigator.clipboard.writeText(blob).then(() => toast("Prompt copied. Paste it into Grok.")).catch(() => toast("Copy failed — select from Settings notes."));
    });
  }

  function showItemRecap() {
    const item = session.tutorItem;
    if (!item) return renderQuestion();
    const ok = session.tutorOk;
    const choiceId = session.tutorChoice;
    const correctChoice = item.choices.find((c) => c.correct);
    show("lesson", `
      ${renderTop()}
      <div class="lesson-top">
        <button class="back-btn" data-go="home" type="button" aria-label="Back">←</button>
        <div class="track"><span style="width:${Math.round(((session.index + 1) / session.lesson.items.length) * 100)}%"></span></div>
        <div class="stat hearts">❤ ${state.hearts}</div>
      </div>
      <article class="prompt-card">
        <div class="q-label">Answer recap · ${session.index + 1} / ${session.lesson.items.length}</div>
        ${item.vignette ? `<div class="vignette"><span class="vignette-label">Scenario</span>${item.vignette}</div>` : ""}
        <h2>${item.stem}</h2>
        <div class="choices">
          ${item.choices.map((c, i) => {
            const letters = ["A", "B", "C", "D", "E"];
            const cls = c.correct ? "choice correct" : (c.id === choiceId && !ok ? "choice wrong" : "choice");
            return `<button class="${cls}" type="button" disabled><span class="choice-key">${letters[i]}</span>${c.text}</button>`;
          }).join("")}
        </div>
      </article>
      <div class="sheet open ${ok ? "good" : "bad"}" id="sheet">
        <h3>${ok ? "Solid." : "Not that one."}</h3>
        <p>${item.explanation}</p>
        ${item.work && item.work.length ? `<ol class="work">${item.work.map((s) => `<li>${s}</li>`).join("")}</ol>` : ""}
        ${!ok && item.miss ? `<p class="why">${item.miss}</p>` : ""}
        <div class="check-wrap two-btns">
          <button class="btn btn-ghost" id="ask-btn" type="button">Ask about this</button>
          <button class="btn btn-primary" id="next-btn" type="button">${session.index + 1 >= session.lesson.items.length ? "See results" : "Continue"}</button>
        </div>
      </div>
    `);
    $("#ask-btn").addEventListener("click", renderTutor);
    $("#next-btn").addEventListener("click", () => {
      if (!ok && state.hearts <= 0 && session.index + 1 < session.lesson.items.length) return renderOutOfHearts();
      session.index += 1;
      session.locked = false;
      session.tutor = null;
      if (session.index >= session.lesson.items.length) renderComplete();
      else renderQuestion();
    });
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/\n/g, "<br>");
  }
  function escapeAttr(s) {
    return String(s).replace(/&/g, "&amp;").replace(/"/g, "&quot;");
  }

  function renderSettings() {
    show("settings", `
      ${renderTop()}
      <section class="splash">
        <div class="kicker">Discussion</div>
        <h1>Ask-about-this</h1>
        <p class="lede">Every item already has an on-device tutor that stays on the keyed solution. To talk to Grok live, add an xAI API key and open the app over https (the PWA), not as a local file.</p>
        <label class="settings-label" for="xai-key">xAI API key</label>
        <input class="settings-input" id="xai-key" type="password" placeholder="xai-…" value="${state.xaiKey ? "••••••••" : ""}" />
        <p class="fineprint">Stored only in this browser. The key is sent to api.x.ai when you ask a live question. Leave blank to keep the on-device tutor. Get a key at console.x.ai.</p>
        <div class="cta-row" style="margin-top:16px">
          <button class="btn btn-primary" id="save-key" type="button">Save</button>
          <button class="btn btn-ghost" id="clear-key" type="button">Clear key</button>
          <button class="btn btn-ghost" data-go="home" type="button">Back</button>
        </div>
      </section>
    `);
    $("#save-key").addEventListener("click", () => {
      const v = $("#xai-key").value.trim();
      if (v && !v.startsWith("•")) state.xaiKey = v;
      save();
      toast(state.xaiKey ? "Key saved on this device." : "No new key typed.");
    });
    $("#clear-key").addEventListener("click", () => {
      state.xaiKey = "";
      save();
      $("#xai-key").value = "";
      toast("Key removed.");
    });
  }


  regenerateHearts();
  if (!state.seenSplash) renderSplash();
  else renderHome();
})();

  
  
  
  
  </script>
  <script>
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }
  </script>
</body>

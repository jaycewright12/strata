<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>STRATA — Conceptual geotech for the FE & PE</title>
  <meta name="theme-color" content="#c24e1d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="STRATA" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png" />
  <style>




:root {
  --paper: #f3eee4;
  --paper-2: #e8e0d2;
  --card: #fffaf2;
  --ink: #1b1712;
  --ink-soft: #5c5348;
  --line: #d9cfbf;
  --clay: #c24e1d;
  --clay-deep: #9a3914;
  --ochre: #c99212;
  --moss: #2f6a4a;
  --moss-deep: #1e4a34;
  --water: #2a6a78;
  --sand: #c6a36e;
  --heart: #c43c3c;
  --locked: #b3aa9c;
  --shadow: 0 18px 40px rgba(40, 28, 12, 0.10);
  --radius: 22px;
  --font-display: "Fraunces", "Times New Roman", serif;
  --font-body: "Source Sans 3", "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { min-height: 100%; }
body {
  font-family: var(--font-body);
  color: var(--ink);
  background:
    radial-gradient(1200px 500px at 10% -10%, rgba(194, 78, 29, 0.08), transparent 50%),
    radial-gradient(900px 400px at 100% 0%, rgba(42, 106, 120, 0.08), transparent 45%),
    var(--paper);
  letter-spacing: 0.01em;
}

button { font-family: inherit; cursor: pointer; }
button:disabled { cursor: not-allowed; opacity: 0.55; }

.app {
  max-width: 760px;
  margin: 0 auto;
  min-height: 100vh;
  padding: 0 18px 80px;
  position: relative;
}

.strata-bg {
  position: fixed;
  inset: auto 0 0 0;
  height: 88px;
  pointer-events: none;
  background:
    linear-gradient(180deg, transparent, rgba(27,23,18,0.04)),
    repeating-linear-gradient(180deg,
      #d7c4a3 0 14px,
      #c9a87a 14px 26px,
      #b0895a 26px 36px,
      #8f5d38 36px 48px,
      #6d4328 48px 62px,
      #4a2e1c 62px 88px);
  opacity: 0.35;
}

/* Header */
.topbar {
  position: sticky;
  top: 0;
  z-index: 20;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 14px 0 12px;
  background: linear-gradient(180deg, var(--paper) 70%, transparent);
}
.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  background: none;
  border: 0;
  color: inherit;
}
.core-logo {
  width: 36px;
  height: 36px;
}
.brand-name {
  font-family: var(--font-display);
  font-weight: 600;
  font-size: 22px;
  letter-spacing: -0.03em;
  line-height: 1;
}
.brand-name span { color: var(--clay); }
.brand-sub {
  display: block;
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--ink-soft);
  margin-top: 2px;
}
.stats {
  display: flex;
  gap: 8px;
}
.stat {
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 6px 10px;
  font-weight: 650;
  font-size: 14px;
  box-shadow: 0 1px 0 rgba(255,255,255,0.7) inset;
}
.stat.hearts { color: var(--heart); }
.stat.streak { color: var(--clay); }
.stat.xp { color: var(--water); }

/* Screens */
.screen { display: none; animation: rise 0.35s ease; }
.screen.active { display: block; }
@keyframes rise {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: none; }
}

/* Splash */
.splash {
  padding: 36px 0 20px;
  text-align: left;
}
.kicker {
  font-size: 12px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--clay);
  font-weight: 700;
}
.splash h1 {
  font-family: var(--font-display);
  font-size: clamp(36px, 8vw, 58px);
  line-height: 0.95;
  letter-spacing: -0.04em;
  margin: 10px 0 16px;
  font-weight: 600;
}
.splash p.lede {
  font-size: 18px;
  color: var(--ink-soft);
  max-width: 34em;
  line-height: 1.45;
}
.pill-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 22px 0 28px; }
.pill {
  border: 1px solid var(--line);
  background: var(--card);
  border-radius: 999px;
  padding: 7px 12px;
  font-size: 13px;
  color: var(--ink-soft);
}
.cta-row { display: flex; flex-wrap: wrap; gap: 10px; }
.btn {
  border: 0;
  border-radius: 16px;
  padding: 14px 18px;
  font-weight: 700;
  font-size: 16px;
}
.btn-primary {
  background: var(--clay);
  color: #fffaf2;
  box-shadow: 0 8px 0 var(--clay-deep);
}
.btn-primary:active { transform: translateY(2px); box-shadow: 0 6px 0 var(--clay-deep); }
.btn-ghost {
  background: transparent;
  border: 1.5px solid var(--ink);
  color: var(--ink);
}
.fineprint {
  margin-top: 18px;
  font-size: 12px;
  color: var(--ink-soft);
  max-width: 40em;
}

/* Home path */
.unit {
  margin: 10px 0 34px;
}
.unit-head {
  display: flex;
  justify-content: space-between;
  align-items: end;
  gap: 12px;
  margin-bottom: 8px;
}
.unit-head h2 {
  font-family: var(--font-display);
  font-size: 28px;
  letter-spacing: -0.03em;
  font-weight: 600;
}
.unit-head p { color: var(--ink-soft); font-size: 14px; max-width: 28em; }
.progress-chip {
  font-size: 12px;
  font-weight: 700;
  background: #efe4cf;
  border-radius: 999px;
  padding: 6px 10px;
  white-space: nowrap;
}

.path {
  position: relative;
  padding: 18px 0 8px;
}
.path::before {
  content: "";
  position: absolute;
  left: 36px;
  top: 20px;
  bottom: 20px;
  width: 4px;
  border-radius: 4px;
  background: repeating-linear-gradient(
    180deg,
    var(--sand),
    var(--sand) 10px,
    var(--line) 10px,
    var(--line) 18px
  );
}
.lesson-node {
  position: relative;
  display: grid;
  grid-template-columns: 76px 1fr;
  gap: 8px;
  align-items: center;
  margin: 14px 0;
  background: none;
  border: 0;
  text-align: left;
  width: 100%;
  color: inherit;
}
.lesson-node:nth-child(even) { padding-left: 28px; }
.node-orb {
  width: 72px;
  height: 72px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 22px;
  background: var(--card);
  border: 3px solid var(--line);
  box-shadow: var(--shadow);
  position: relative;
  z-index: 1;
}
.lesson-node.done .node-orb {
  background: var(--moss);
  border-color: var(--moss-deep);
  color: #f3eee4;
}
.lesson-node.current .node-orb {
  background: var(--clay);
  border-color: var(--clay-deep);
  color: #fff;
  animation: pulse 1.8s ease infinite;
}
.lesson-node.locked .node-orb {
  background: #ece5d8;
  color: var(--locked);
}
@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(194,78,29,0.35); }
  50% { box-shadow: 0 0 0 10px rgba(194,78,29,0); }
}
.node-copy {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 12px 14px;
  box-shadow: var(--shadow);
}
.node-copy h3 { font-size: 17px; font-weight: 750; }
.node-copy p { font-size: 13px; color: var(--ink-soft); margin-top: 3px; }
.node-meta {
  margin-top: 6px;
  font-size: 12px;
  font-weight: 700;
  color: var(--clay);
}

.home-extra {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  margin-top: 8px;
}
.panel {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px;
  box-shadow: var(--shadow);
}
.panel h3 { font-family: var(--font-display); font-size: 20px; margin-bottom: 6px; }
.panel p { color: var(--ink-soft); font-size: 14px; line-height: 1.4; }
.panel .btn { margin-top: 12px; width: 100%; }

/* Lesson */
.lesson-top {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 0 14px;
}
.back-btn, .icon-btn {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: var(--card);
  font-size: 18px;
}
.track {
  flex: 1;
  height: 10px;
  background: #e5d9c6;
  border-radius: 99px;
  overflow: hidden;
}
.track > span {
  display: block;
  height: 100%;
  width: 0;
  background: linear-gradient(90deg, var(--ochre), var(--clay));
  border-radius: 99px;
  transition: width 0.25s ease;
}

.prompt-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 24px;
  padding: 22px 20px 18px;
  box-shadow: var(--shadow);
}
.q-label {
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--water);
  font-weight: 700;
}
.prompt-card h2 {
  font-size: 22px;
  line-height: 1.3;
  margin: 8px 0 14px;
  font-weight: 650;
}
.prompt-card h2 em, .var {
  font-style: italic;
  font-family: var(--font-display);
}
.vignette {
  background: #fff7e8;
  border: 2px solid #c99212;
  border-left: 8px solid #c24e1d;
  padding: 14px 16px 16px;
  border-radius: 14px;
  color: #1b1712;
  margin: 12px 0 18px;
  font-size: 18px;
  line-height: 1.45;
  font-weight: 600;
  box-shadow: 0 6px 0 rgba(194, 78, 29, 0.12);
}
.vignette-label {
  display: block;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: #c24e1d;
  margin-bottom: 6px;
}
.diagram {
  background: #fff8ee;
  border: 2px solid #cbb896;
  border-radius: 16px;
  padding: 10px 10px 8px;
  margin: 0 0 16px;
  overflow: hidden;
}
.diagram-label {
  display: block;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: #8f5d38;
  margin-bottom: 6px;
}
.diagram svg { width: 100%; max-height: 240px; height: auto; display: block; }

.choices { display: grid; gap: 10px; }
.choice {
  text-align: left;
  border: 2px solid var(--line);
  background: #fff;
  border-radius: 16px;
  padding: 12px 14px;
  font-size: 16px;
  color: var(--ink);
  transition: border-color 0.15s, transform 0.12s, background 0.15s;
}
.choice:hover { border-color: var(--ink); }
.choice.selected { border-color: var(--clay); background: #fbeee6; }
.choice.correct { border-color: var(--moss); background: #e8f4ec; }
.choice.wrong { border-color: var(--heart); background: #fdecec; }
.choice-key {
  display: inline-grid;
  place-items: center;
  width: 22px;
  height: 22px;
  border-radius: 6px;
  background: #efe6d6;
  font-size: 12px;
  font-weight: 800;
  margin-right: 8px;
}

.check-wrap { margin-top: 16px; }
.check-wrap .btn { width: 100%; }

/* Feedback sheet */
.sheet {
  position: fixed;
  left: 50%;
  transform: translateX(-50%) translateY(120%);
  bottom: 0;
  width: min(760px, 100%);
  background: var(--card);
  border-top: 1px solid var(--line);
  border-radius: 24px 24px 0 0;
  padding: 18px 20px 24px;
  box-shadow: 0 -12px 40px rgba(0,0,0,0.12);
  transition: transform 0.28s ease;
  z-index: 30;
}
.sheet.open { transform: translateX(-50%) translateY(0); }
.sheet.good { background: #eef7f0; }
.sheet.bad { background: #fdf2f0; }
.sheet h3 { font-family: var(--font-display); font-size: 26px; margin-bottom: 6px; }
.sheet p { font-size: 15px; line-height: 1.45; color: var(--ink); }
.sheet .why { margin-top: 8px; color: var(--ink-soft); }
.fepe {
  margin-top: 10px;
  font-size: 13px;
  background: rgba(255,255,255,0.7);
  border-radius: 12px;
  padding: 8px 10px;
  color: var(--water);
  font-weight: 600;
}

/* Complete */
.complete {
  text-align: center;
  padding: 28px 8px;
}
.complete .medal {
  width: 92px;
  height: 92px;
  margin: 0 auto 12px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: var(--ochre);
  color: #1b1712;
  font-size: 40px;
  box-shadow: 0 10px 0 #9a7010;
}
.complete h2 {
  font-family: var(--font-display);
  font-size: 40px;
  letter-spacing: -0.03em;
}
.xp-burst {
  font-size: 28px;
  font-weight: 800;
  color: var(--clay);
  margin: 8px 0 18px;
}
.recap {
  text-align: left;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 14px;
  margin: 16px 0;
}
.recap li { margin: 6px 0 6px 18px; color: var(--ink-soft); }

/* Review / reference */
.item-list { display: grid; gap: 10px; }
.miss-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 12px 14px;
}
.miss-card strong { display: block; margin-bottom: 4px; }
.ref-grid { display: grid; gap: 12px; }
.ref-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 16px;
}
.ref-card h3 { font-family: var(--font-display); font-size: 22px; margin-bottom: 6px; }
.ref-card ul { padding-left: 18px; color: var(--ink-soft); }
.ref-card li { margin: 6px 0; }

.var-table { width: 100%; border-collapse: collapse; margin-top: 8px; }
.var-table th, .var-table td {
  text-align: left; vertical-align: top;
  padding: 10px 8px; border-bottom: 1px solid var(--line);
  font-size: 14px; line-height: 1.35;
}
.var-table th { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-soft); }
.var-table .sym {
  font-family: var(--font-mono);
  font-weight: 700;
  white-space: nowrap;
  color: var(--clay-deep);
  width: 28%;
}
.var-table .nm { font-weight: 700; color: var(--ink); display: block; margin-bottom: 2px; }
.var-table .df { color: var(--ink-soft); }
.ref-card.symbols { padding: 16px 12px 8px; }

.eq {
  font-family: var(--font-mono);
  background: #f3eadb;
  padding: 2px 6px;
  border-radius: 6px;
}

.toast {
  position: fixed;
  left: 50%;
  bottom: 24px;
  transform: translateX(-50%) translateY(20px);
  background: var(--ink);
  color: #f3eee4;
  padding: 10px 14px;
  border-radius: 12px;
  opacity: 0;
  pointer-events: none;
  transition: 0.25s ease;
  z-index: 50;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.out-of-hearts {
  text-align: center;
  padding: 40px 10px;
}
.out-of-hearts h2 { font-family: var(--font-display); font-size: 34px; }


html { -webkit-text-size-adjust: 100%; }
body {
  padding-bottom: env(safe-area-inset-bottom);
}
.app {
  padding-left: max(18px, env(safe-area-inset-left));
  padding-right: max(18px, env(safe-area-inset-right));
  padding-bottom: calc(80px + env(safe-area-inset-bottom));
}
.topbar {
  padding-top: max(14px, env(safe-area-inset-top));
}
.choice, .btn, .lesson-node, .back-btn {
  min-height: 48px;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}
.sheet {
  padding-bottom: calc(24px + env(safe-area-inset-bottom));
}
@media (max-width: 560px) {
  .home-extra { grid-template-columns: 1fr; }
  .splash h1 { font-size: 36px; }
  .stats { gap: 6px; }
  .stat { padding: 6px 8px; }
  .stat span.label { display: none; }
  .prompt-card { padding: 18px 14px 16px; }
  .prompt-card h2 { font-size: 20px; }
  .vignette { font-size: 17px; }
  .choice { font-size: 15px; }
  .brand-sub { display: none; }
  .path::before { left: 32px; }
  .node-orb { width: 64px; height: 64px; }
  .lesson-node { grid-template-columns: 64px 1fr; }
}


  
.bench-banner {
  margin: 28px 0 8px;
  padding: 18px 16px;
  background: #1b1712;
  color: #f3eee4;
  border-radius: 22px;
}
.bench-banner .kicker { color: #e0a36a; }
.bench-banner h2 {
  font-family: var(--font-display);
  font-size: 28px;
  letter-spacing: -0.03em;
  margin: 6px 0 8px;
}
.bench-banner p { color: #d9d0c4; font-size: 15px; max-width: 38em; line-height: 1.4; }
.bench-unit .node-orb { border-color: #1b1712; }
.given {
  font-family: var(--font-mono);
  font-size: 13px;
  background: #efe6d4;
  border-radius: 10px;
  padding: 8px 10px;
  margin: 0 0 12px;
  color: #3d3428;
}
.work {
  margin: 10px 0 6px 18px;
  color: var(--ink);
  font-size: 14px;
}
.work li { margin: 4px 0; }

  
  
  
.two-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.gear { width: 36px; height: 36px; border-radius: 10px; }
.tutor { padding: 8px 0 24px; }
.tutor-head { display: flex; justify-content: space-between; gap: 12px; align-items: start; margin-bottom: 12px; }
.tutor-head h1 { font-family: var(--font-display); font-size: 32px; letter-spacing: -0.03em; }
.tutor-item {
  background: #fff7e8;
  border: 2px solid #c99212;
  border-left: 8px solid #c24e1d;
  border-radius: 14px;
  padding: 12px 14px;
  margin-bottom: 12px;
}
.tutor-item strong { display: block; margin-bottom: 6px; }
.tutor-item span { color: var(--ink-soft); font-size: 14px; }
.tutor-log {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 12px;
  min-height: 180px;
  max-height: 42vh;
  overflow: auto;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.bubble {
  padding: 10px 12px;
  border-radius: 14px;
  font-size: 15px;
  line-height: 1.45;
  max-width: 95%;
}
.bubble.user { align-self: flex-end; background: #f3d7c6; }
.bubble.assistant { align-self: flex-start; background: #efe6d4; }
.chip-row { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; }
.chip { cursor: pointer; background: var(--card); }
.tutor-form { display: grid; grid-template-columns: 1fr auto; gap: 8px; margin: 8px 0; }
.tutor-form input, .settings-input {
  border: 2px solid var(--line);
  border-radius: 14px;
  padding: 12px 14px;
  font: inherit;
  font-size: 16px;
  background: #fff;
}
.settings-label { display: block; font-weight: 700; margin: 18px 0 6px; }
.settings-block + .settings-block { margin-top: 18px; }
.toggle-row { display: flex; align-items: flex-start; gap: 14px; margin-top: 16px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 16px; background: var(--card); cursor: pointer; }
.toggle-row input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.toggle-ui { flex: 0 0 auto; width: 46px; height: 26px; border-radius: 999px; background: var(--locked); position: relative; transition: background .15s; margin-top: 2px; }
.toggle-ui::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: left .15s; }
.toggle-row input:checked + .toggle-ui { background: var(--moss); }
.toggle-row input:checked + .toggle-ui::after { left: 23px; }
.toggle-row input:focus-visible + .toggle-ui { outline: 3px solid var(--water); outline-offset: 2px; }
.toggle-copy { display: flex; flex-direction: column; gap: 4px; }
.toggle-copy span { color: var(--ink-soft); font-size: 14px; }
.pack-list { display: grid; gap: 10px; margin-top: 14px; }
.pack-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; border: 1px solid var(--line); border-radius: 16px; background: var(--card); }
.pack-row.broken { border-color: var(--heart); }
.pack-main { min-width: 0; }
.pack-sub { color: var(--ink-soft); font-size: 13px; margin-top: 3px; overflow-wrap: anywhere; }
.pack-ver { color: var(--ink-soft); font-size: 13px; font-weight: 600; }
.pack-badge { display: inline-block; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; border-radius: 999px; padding: 1px 8px; margin-left: 6px; vertical-align: 2px; }
.pack-badge.builtin { background: var(--paper-2); color: var(--ink-soft); }
.pack-badge.imported { background: var(--water); color: #fff; }
.pack-badge.bad { background: var(--heart); color: #fff; }
.btn-small { padding: 8px 14px; font-size: 14px; }
.import-result { display: none; margin-top: 16px; padding: 14px 18px; border-radius: 16px; border: 2px solid var(--line); background: var(--card); }
.import-result.show { display: block; }
.import-result.good { border-color: var(--moss); }
.import-result.bad { border-color: var(--heart); }
.import-result h3 { font-family: var(--font-display); margin-bottom: 6px; }
.import-result p { color: var(--ink-soft); }
.issue-head { font-weight: 700; margin-top: 10px; font-size: 14px; }
.issues { margin: 4px 0 0 18px; font-size: 13px; color: var(--ink-soft); }
.issues code { font-size: 12px; overflow-wrap: anywhere; }
.pack-tag { display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--water); border: 1px solid var(--water); border-radius: 999px; padding: 2px 10px; margin-bottom: 6px; }
@media (max-width: 560px) {
  .two-btns { grid-template-columns: 1fr; }
  .tutor-head { flex-direction: column; }
}


/* PE topic syllabus */
.topic {
  margin: 18px 0 40px;
  padding: 16px 14px 8px;
  background: var(--card);
  border: 1.5px solid var(--line);
  border-radius: 22px;
}
.topic-head {
  display: flex;
  justify-content: space-between;
  align-items: start;
  gap: 12px;
  margin-bottom: 10px;
  padding: 0 4px;
}
.topic-head .kicker {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--water);
  margin-bottom: 4px;
}
.topic-head h2 {
  font-family: var(--font-display);
  font-size: 24px;
  letter-spacing: -0.03em;
  font-weight: 600;
  line-height: 1.15;
}
.topic-head p { color: var(--ink-soft); font-size: 13px; max-width: 36em; margin-top: 4px; }
.topic .unit { margin: 8px 0 16px; padding: 0 4px; }
.topic .unit-head h2 { font-size: 18px; }
.topic .unit-head p { font-size: 13px; }
.track-label {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--ink-soft);
  margin: 10px 4px 0;
}
.track-label.bench { color: #a66b2b; }
.empty-shell {
  margin: 8px 4px 14px;
  padding: 14px 16px;
  border-radius: 14px;
  border: 1.5px dashed var(--line);
  color: var(--ink-soft);
  font-size: 14px;
  background: #faf6ee;
}
.all-topics {
  margin: 8px 0 28px;
  padding: 20px 18px;
  background: linear-gradient(135deg, #1f4d3a 0%, #2a6b4f 60%, #3d7a5c 100%);
  color: #f3eee4;
  border-radius: 22px;
}
.all-topics .kicker { color: #b8e0c8; font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; }
.all-topics h2 {
  font-family: var(--font-display);
  font-size: 28px;
  letter-spacing: -0.03em;
  margin: 6px 0 8px;
}
.all-topics p { color: #d5e8dc; font-size: 15px; max-width: 38em; line-height: 1.4; margin-bottom: 14px; }
.all-topics .btn-primary {
  background: #f3eee4;
  color: #1f4d3a;
  border-color: #f3eee4;
}
.topic.bench-unit .node-orb, .topic .bench-unit .node-orb { border-color: #1b1712; }

.section-scores {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-top: 10px;
}
.score-chip {
  display: inline-flex;
  flex-direction: column;
  min-width: 72px;
  padding: 8px 12px;
  border-radius: 14px;
  background: #f4efe6;
  border: 1.5px solid var(--line);
  line-height: 1.15;
}
.score-chip .score-label {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: .08em;
  text-transform: uppercase;
  color: var(--ink-soft);
  margin-bottom: 3px;
}
.score-chip .score-val {
  font-family: var(--font-display);
  font-size: 20px;
  font-weight: 600;
  letter-spacing: -0.03em;
  color: var(--ink);
}
.score-chip.empty .score-val { color: var(--ink-soft); font-size: 16px; }
.topic-head-right {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 8px;
}
.all-topics .section-scores { margin: 0 0 12px; }
.all-topics .score-chip {
  background: rgba(243,238,228,0.14);
  border-color: rgba(243,238,228,0.28);
}
.all-topics .score-chip .score-label { color: #b8e0c8; }
.all-topics .score-chip .score-val { color: #f3eee4; }
.all-topics .score-chip.empty .score-val { color: #9bc4ad; }

<body>
  <div class="strata-bg" aria-hidden="true"></div>
  <div class="app" id="app"></div>
  <div class="toast" id="toast" role="status"></div>
  <script src="packs/index.js"></script>
  <script>
  /* ===================== STRATA pack engine =====================
   * Built-in packs: files listed in packs/index.js, loaded with <script src>, each calling
   *   (window.STRATA_PACKS = window.STRATA_PACKS || []).push({ id, title, version, units, figs, itemFigs, ... })
   * Imported packs: JSON (or JS-literal) files picked in Settings, kept in localStorage "strata-packs-v1".
   * Every pack is validated; bad units/lessons/items are skipped with a console warning.
   * Imported text is sanitized (tiny HTML subset) and imported SVG figures are sanitized. */
  window.STRATA_PACKS = window.STRATA_PACKS || [];
  window.STRATA = (function () {
    const PACKS_KEY = "strata-packs-v1";
    const ID_RE = /^[A-Za-z0-9][A-Za-z0-9_.:-]{0,79}$/;
    const CHOICE_ID_RE = /^[A-Za-z0-9_-]{1,16}$/;
    const FILE_RE = /^[A-Za-z0-9][A-Za-z0-9._-]*\.js$/;
    const RESERVED_LESSON_IDS = ["mixed-concepts", "review"];
    const MAX_IMPORT_BYTES = 2 * 1024 * 1024;
    const MAX_SVG_CHARS = 200000;

    /* ---------- HTML sanitizer (imported text) ---------- */
    const KEEP_TAGS = new Set(["b", "strong", "i", "em", "u", "sub", "sup", "br", "code", "small", "span"]);
    const DROP_TAGS = new Set(["script", "style", "iframe", "frame", "frameset", "object", "embed", "applet", "svg", "math",
      "template", "noscript", "noembed", "noframes", "textarea", "select", "option", "title", "xmp", "plaintext", "head",
      "link", "meta", "base", "form", "input", "button", "video", "audio", "canvas", "img", "picture", "source", "portal"]);
    function escapeText(s) {
      return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }
    function sanitizeHtml(input) {
      if (input == null) return "";
      const s = String(input);
      if (!/[<&]/.test(s)) return escapeText(s);
      const doc = new DOMParser().parseFromString("<!doctype html><body>" + s, "text/html"); // inert: no scripts run, nothing loads
      const walk = (node) => {
        let out = "";
        node.childNodes.forEach((n) => {
          if (n.nodeType === 3) out += escapeText(n.nodeValue);
          else if (n.nodeType === 1) {
            const tag = n.localName;
            if (DROP_TAGS.has(tag)) return;
            if (tag === "br") out += "<br>";
            else if (KEEP_TAGS.has(tag)) out += "<" + tag + ">" + walk(n) + "</" + tag + ">";
            else out += walk(n); // unknown/disallowed but harmless: keep its text, drop the tag + attributes
          }
        });
        return out;
      };
      return walk(doc.body);
    }

    /* ---------- SVG sanitizer (imported figures) ---------- */
    const SVG_TAGS = new Set(["svg", "g", "path", "rect", "circle", "ellipse", "line", "polyline", "polygon", "text", "tspan",
      "defs", "marker", "title", "desc", "lineargradient", "radialgradient", "stop", "pattern", "clippath", "mask", "symbol", "use"]);
    const SVG_NS = "http://www.w3.org/2000/svg";
    function safeAttr(name, value) {
      const n = name.toLowerCase();
      if (!/^[a-z_:][-a-z0-9_:.]*$/.test(n)) return false;
      if (n.startsWith("on")) return false;                         // event handlers
      if (n === "src" || n === "action" || n === "formaction" || n.startsWith("xmlns:") && n !== "xmlns:xlink") return false;
      const v = String(value).replace(/[\u0000-\u0020]+/g, "").toLowerCase();
      if (n === "href" || n === "xlink:href") return v.startsWith("#"); // local references only
      if (/javascript:|vbscript:|data:|expression\(|@import|behavior:|-moz-binding/.test(v)) return false;
      if (/url\((?!['"]?#)/.test(v)) return false;                  // url(...) must point inside the SVG
      return true;
    }
    function sanitizeSvg(input) {
      let s = String(input || "").trim();
      if (!/^<svg[\s>]/i.test(s)) throw new Error("figure must start with <svg");
      if (s.length > MAX_SVG_CHARS) throw new Error("figure is larger than " + MAX_SVG_CHARS + " characters");
      if (!/^<svg[^>]*\sxmlns\s*=/i.test(s)) s = s.replace(/^<svg/i, '<svg xmlns="' + SVG_NS + '"');
      const doc = new DOMParser().parseFromString(s, "image/svg+xml");
      if (doc.getElementsByTagName("parsererror").length) throw new Error("figure is not well-formed SVG/XML");
      const root = doc.documentElement;
      if (!root || root.localName !== "svg" || root.namespaceURI !== SVG_NS) throw new Error("root element is not <svg>");
      let removed = 0;
      const clean = (el) => {
        Array.from(el.childNodes).forEach((n) => {
          if (n.nodeType === 1) {
            if (n.namespaceURI !== SVG_NS || !SVG_TAGS.has(n.localName.toLowerCase())) { n.remove(); removed++; return; }
            clean(n);
          } else if (n.nodeType === 4) {                             // CDATA -> plain text
            el.replaceChild(doc.createTextNode(n.nodeValue), n);
          } else if (n.nodeType !== 3) { n.remove(); }               // comments, processing instructions
        });
        Array.from(el.attributes).forEach((a) => { if (!safeAttr(a.name, a.value)) { el.removeAttribute(a.name); removed++; } });
      };
      clean(root);
      return { svg: new XMLSerializer().serializeToString(root), removed };
    }

    /* ---------- JS-literal parser (for importing .js packs without running them) ---------- */
    function parseLiteral(src, start) {
      let i = start;
      const fail = (msg) => { throw new Error(msg + " at character " + i); };
      const ws = () => {
        for (;;) {
          while (i < src.length && /\s/.test(src[i])) i++;
          if (src.startsWith("//", i)) { while (i < src.length && src[i] !== "\n") i++; }
          else if (src.startsWith("/*", i)) { const e = src.indexOf("*/", i + 2); if (e < 0) fail("unclosed comment"); i = e + 2; }
          else return;
        }
      };
      const str = () => {
        const q = src[i++]; let out = "";
        while (i < src.length && src[i] !== q) {
          let c = src[i++];
          if (q === "`" && c === "$" && src[i] === "{") fail("template expressions ${...} are not allowed");
          if (c === "\\") {
            c = src[i++];
            const map = { n: "\n", t: "\t", r: "\r", b: "\b", f: "\f", v: "\v", 0: "\0" };
            if (c in map) out += map[c];
            else if (c === "u") {
              if (src[i] === "{") { const e = src.indexOf("}", i); out += String.fromCodePoint(parseInt(src.slice(i + 1, e), 16)); i = e + 1; }
              else { out += String.fromCharCode(parseInt(src.substr(i, 4), 16)); i += 4; }
            } else if (c === "x") { out += String.fromCharCode(parseInt(src.substr(i, 2), 16)); i += 2; }
            else if (c === "\n") { /* line continuation */ }
            else out += c;
          } else {
            if (q !== "`" && c === "\n") fail("newline in string");
            out += c;
          }
        }
        if (src[i] !== q) fail("unterminated string");
        i++; return out;
      };
      const value = () => {
        ws();
        const c = src[i];
        if (c === "{") {
          i++; const o = {};
          for (;;) {
            ws(); if (src[i] === "}") { i++; return o; }
            let k;
            if (src[i] === '"' || src[i] === "'") k = str();
            else { const m = /^[A-Za-z_$][\w$]*|^\d+/.exec(src.slice(i, i + 200)); if (!m) fail("expected a key"); k = m[0]; i += k.length; }
            ws(); if (src[i] !== ":") fail("expected ':'"); i++;
            if (k === "__proto__") fail("__proto__ key not allowed");
            o[k] = value(); ws();
            if (src[i] === ",") { i++; continue; }
            if (src[i] === "}") { i++; return o; }
            fail("expected ',' or '}'");
          }
        }
        if (c === "[") {
          i++; const a = [];
          for (;;) {
            ws(); if (src[i] === "]") { i++; return a; }
            a.push(value()); ws();
            if (src[i] === ",") { i++; continue; }
            if (src[i] === "]") { i++; return a; }
            fail("expected ',' or ']'");
          }
        }
        if (c === '"' || c === "'" || c === "`") return str();
        const m = /^(-?(?:\d+\.?\d*|\.\d+)(?:[eE][+-]?\d+)?|true|false|null)/.exec(src.slice(i, i + 40));
        if (!m) fail("unexpected token");
        i += m[0].length;
        return m[0] === "true" ? true : m[0] === "false" ? false : m[0] === "null" ? null : Number(m[0]);
      };
      const v = value();
      return { value: v, end: i };
    }
    /** Parse a pack file's text (JSON, or the .js pack format) WITHOUT executing it. */
    function parsePackText(text, filename) {
      const t = String(text || "").replace(/^\uFEFF/, "");
      const isJs = /\.js$/i.test(filename || "") || !/^\s*[\[{]/.test(t);
      if (!isJs) {
        try { return JSON.parse(t); }
        catch (e) {
          try { return parseLiteral(t, 0).value; } catch (e2) { throw new Error("Not valid JSON: " + e.message); }
        }
      }
      const m = /(?:STRATA_PACKS[^;]*?\.push|registerPack)\s*\(/.exec(t);
      let start = m ? m.index + m[0].length : t.search(/[{]/);
      if (start < 0) throw new Error("No pack object found. Expected STRATA_PACKS.push({ ... }) or a JSON object.");
      try {
        const r = parseLiteral(t, start);
        return r.value;
      } catch (e) { throw new Error("Could not read the pack object: " + e.message + " (only plain data is allowed: no functions, variables or ${…})"); }
    }

    /* ---------- validation + normalization ---------- */
    const isStr = (v) => typeof v === "string" && v.trim() !== "";
    const isTxt = (v) => isStr(v) || typeof v === "number";
    const LETTER_REF_RE = /\b(?:pick|picks|picked|choose|chose|chosen|select|selected)\s+[A-E]\b|\b[A-E]\s+is\s+(?:correct|right|wrong|incorrect|the\b)|\b[A-E]\s*[,)]?\s+(?:and|or)\s+[A-E]\s+are\b/;

    function newRegistry() {
      return { packs: [], units: [], reference: [], variables: [], figs: {}, itemFigs: {},
        unitIds: new Set(), lessonIds: new Set(RESERVED_LESSON_IDS), itemIds: new Set(), packIds: new Set() };
    }

    /**
     * Validate a raw pack against the registry. Nothing in `reg` is changed; call commit() to merge.
     * opts.trusted: built-in pack (text is used as-is, figures are not sanitized).
     */
    function validatePack(raw, reg, opts) {
      opts = opts || {};
      const trusted = !!opts.trusted;
      const rejected = [], warnings = [];
      const T = (v) => (v == null ? "" : trusted ? String(v) : sanitizeHtml(v));
      const res = { ok: false, error: null, rejected, warnings, counts: { units: 0, lessons: 0, items: 0, peItems: 0, figs: 0, reference: 0, variables: 0 } };
      if (!raw || typeof raw !== "object" || Array.isArray(raw)) { res.error = "The file does not contain a pack object."; return res; }
      if (!isStr(raw.id) || !ID_RE.test(raw.id)) { res.error = "Pack \"id\" is missing or invalid (letters, digits, - _ . : only; must start with a letter or digit)."; return res; }
      if (!isStr(raw.title)) { res.error = "Pack \"title\" is missing."; return res; }
      if (reg.packIds.has(raw.id)) { res.error = "A pack with id \"" + raw.id + "\" is already loaded."; return res; }
      if (!Array.isArray(raw.units) || !raw.units.length) { res.error = "Pack has no \"units\" array."; return res; }
      const pid = raw.id;
      const version = raw.version == null || raw.version === "" ? "1" : String(raw.version);
      if (raw.version == null) warnings.push("No \"version\" given; using \"1\".");
      const seenU = new Set(), seenL = new Set(), seenI = new Set();

      // figures: own figs live under "<packId>/<key>" (core: plain key, so legacy STRATA_FIGS keys stay valid)
      const figs = {}, itemFigs = {};
      const ownFigKey = (k) => (pid === "core" ? k : pid + "/" + k);
      const packFigs = raw.figs && typeof raw.figs === "object" && !Array.isArray(raw.figs) ? raw.figs : {};
      if (raw.figs != null && packFigs !== raw.figs) warnings.push("\"figs\" must be an object of key → SVG string; ignored.");
      Object.keys(packFigs).forEach((k) => {
        if (!ID_RE.test(k) || k.includes("/")) { rejected.push({ where: "figs." + k, reason: "invalid figure key" }); return; }
        const key = ownFigKey(k);
        if (reg.figs[key]) { rejected.push({ where: "figs." + k, reason: "figure key already in use" }); return; }
        if (typeof packFigs[k] !== "string") { rejected.push({ where: "figs." + k, reason: "figure must be an SVG string" }); return; }
        if (trusted) { figs[key] = packFigs[k]; return; }
        try {
          const r = sanitizeSvg(packFigs[k]);
          figs[key] = r.svg;
          if (r.removed) warnings.push("figs." + k + ": removed " + r.removed + " unsafe/unsupported SVG element(s) or attribute(s).");
        } catch (e) { rejected.push({ where: "figs." + k, reason: e.message }); }
      });
      const mapFigs = raw.itemFigs && typeof raw.itemFigs === "object" && !Array.isArray(raw.itemFigs) ? raw.itemFigs : {};
      const resolveFig = (where, ref, itemId) => {
        if (ref == null || ref === "") return null;
        if (typeof ref !== "string") { warnings.push(where + ": fig must be a string; figure ignored."); return null; }
        if (/^\s*<svg[\s>]/i.test(ref)) {                             // inline SVG on the item
          const key = pid + "/inline/" + itemId;
          if (trusted) { figs[key] = ref; return key; }
          try { const r = sanitizeSvg(ref); figs[key] = r.svg; if (r.removed) warnings.push(where + ": removed " + r.removed + " unsafe SVG part(s)."); return key; }
          catch (e) { warnings.push(where + ": figure dropped (" + e.message + ")."); return null; }
        }
        if (figs[ownFigKey(ref)]) return ownFigKey(ref);                // this pack's own figure
        if (reg.figs[ref]) return ref;                                   // shared/core figure key (e.g. "wall-ka")
        warnings.push(where + ": unknown figure \"" + ref + "\"; figure ignored.");
        return null;
      };

      const units = [];
      raw.units.forEach((u, ui) => {
        const uw = "units[" + ui + "]" + (u && u.id ? " (" + u.id + ")" : "");
        if (!u || typeof u !== "object") { rejected.push({ where: uw, reason: "not an object" }); return; }
        if (!isStr(u.id) || !ID_RE.test(u.id)) { rejected.push({ where: uw, reason: "missing/invalid unit id" }); return; }
        if (reg.unitIds.has(u.id) || seenU.has(u.id)) { rejected.push({ where: uw, reason: "unit id already exists" }); return; }
        if (!isStr(u.title)) { rejected.push({ where: uw, reason: "missing unit title" }); return; }
        if (!Array.isArray(u.lessons)) { rejected.push({ where: uw, reason: "lessons must be an array" }); return; }
        const lessons = [];
        u.lessons.forEach((l, li) => {
          const lw = uw + " › lesson " + (l && l.id ? l.id : "#" + (li + 1));
          if (!l || typeof l !== "object") { rejected.push({ where: lw, reason: "not an object" }); return; }
          if (!isStr(l.id) || !ID_RE.test(l.id)) { rejected.push({ where: lw, reason: "missing/invalid lesson id" }); return; }
          if (reg.lessonIds.has(l.id) || seenL.has(l.id)) { rejected.push({ where: lw, reason: RESERVED_LESSON_IDS.includes(l.id) ? "lesson id is reserved" : "lesson id already exists" }); return; }
          if (!isStr(l.title)) { rejected.push({ where: lw, reason: "missing lesson title" }); return; }
          if (!Array.isArray(l.items) || !l.items.length) { rejected.push({ where: lw, reason: "no items" }); return; }
          const items = [];
          l.items.forEach((it, ii) => {
            const iw = lw + " › item " + (it && it.id ? it.id : "#" + (ii + 1));
            const bad = (reason) => rejected.push({ where: iw, reason });
            if (!it || typeof it !== "object") return bad("not an object");
            if (!isStr(it.id) || !ID_RE.test(it.id)) return bad("missing/invalid item id");
            if (reg.itemIds.has(it.id) || seenI.has(it.id)) return bad("item id already exists");
            if (it.type != null && it.type !== "mcq") return bad("unsupported type \"" + it.type + "\" (only \"mcq\")");
            if (!isStr(it.stem)) return bad("missing stem");
            if (!Array.isArray(it.choices) || it.choices.length !== 4) return bad("must have exactly 4 choices (has " + (Array.isArray(it.choices) ? it.choices.length : 0) + ")");
            const cids = new Set();
            for (const c of it.choices) {
              if (!c || typeof c !== "object") return bad("a choice is not an object");
              if (!isStr(c.id) || !CHOICE_ID_RE.test(c.id)) return bad("a choice has a missing/invalid id");
              if (cids.has(c.id)) return bad("duplicate choice id \"" + c.id + "\"");
              cids.add(c.id);
              if (!isTxt(c.text)) return bad("choice \"" + c.id + "\" has no text");
            }
            const nCorrect = it.choices.filter((c) => c.correct === true).length;
            if (nCorrect !== 1) return bad("must have exactly one choice with \"correct\": true (has " + nCorrect + ")");
            if (!isStr(it.explanation)) return bad("missing explanation");
            if (it.work != null && !(Array.isArray(it.work) && it.work.every(isTxt))) return bad("\"work\" must be an array of strings");
            const out = trusted ? { ...it } : { id: it.id, type: "mcq" };
            out.stem = T(it.stem);
            out.explanation = T(it.explanation);
            out.choices = it.choices.map((c) => {
              const ch = { id: c.id, text: T(c.text) };
              if (c.correct === true) ch.correct = true;
              return trusted ? { ...c, ...ch } : ch;
            });
            ["miss", "fepe", "label", "vignette", "given"].forEach((k) => {
              if (it[k] == null || it[k] === "") return;
              if (!isTxt(it[k])) { warnings.push(iw + ": \"" + k + "\" is not text; ignored."); delete out[k]; return; }
              out[k] = T(it[k]);
            });
            if (Array.isArray(it.work) && it.work.length) out.work = it.work.map(T);
            if (it.pe != null) out.pe = it.pe === true;
            delete out.fig;
            const figKey = resolveFig(iw, it.fig != null ? it.fig : mapFigs[it.id], it.id);
            if (figKey) itemFigs[it.id] = figKey;
            if (!trusted) {
              const txt = [it.explanation, it.miss, it.fepe].concat(it.work || []).join(" ");
              if (LETTER_REF_RE.test(txt)) warnings.push(iw + ": text seems to name a choice by letter. Letters change when choices are shuffled; name the choice text or write [[" + it.choices[0].id + "]] instead.");
            }
            seenI.add(it.id);
            items.push(out);
          });
          if (!items.length) { rejected.push({ where: lw, reason: "no valid items left" }); return; }
          const num = (v, d, name) => {
            if (v == null) return d;
            const n = Number(v);
            if (!isFinite(n) || n < 0) { warnings.push(lw + ": \"" + name + "\" is not a number; using " + d + "."); return d; }
            return n;
          };
          const lo = trusted ? { ...l } : { id: l.id };
          lo.title = T(l.title);
          lo.minutes = num(l.minutes, 5, "minutes");
          lo.xp = Math.round(num(l.xp, 20, "xp"));

        });
        if (!lessons.length && u.lessons.length) { rejected.push({ where: uw, reason: "no valid lessons left" }); return; }
        /* empty lessons[] = syllabus shell (Coming soon) */
        const uo = trusted ? { ...u } : { id: u.id };
        uo.title = T(u.title);
        uo.blurb = u.blurb == null ? "" : T(u.blurb);
        if (u.bench != null) uo.bench = u.bench === true;
        if (u.topic != null) {
          const tn = Number(u.topic);

        seenU.add(u.id);

      });

      const reference = [];
      (Array.isArray(raw.reference) ? raw.reference : []).forEach((r, i) => {
        if (!r || !isStr(r.title) || !Array.isArray(r.points) || !r.points.every(isTxt)) { rejected.push({ where: "reference[" + i + "]", reason: "needs title + points[]" }); return; }
        reference.push({ title: T(r.title), points: r.points.map(T) });
      });
      const variables = [];
      (Array.isArray(raw.variables) ? raw.variables : []).forEach((v, i) => {
        if (!v || !isTxt(v.sym) || !isTxt(v.name) || !isTxt(v.def)) { rejected.push({ where: "variables[" + i + "]", reason: "needs sym, name, def" }); return; }
        variables.push({ sym: T(v.sym), name: T(v.name), def: T(v.def) });
      });

      let nItems = 0, nPe = 0, nLessons = 0;
      units.forEach((u) => u.lessons.forEach((l) => { nLessons++; l.items.forEach((it) => { nItems++; if (u.bench || it.pe) nPe++; }); }));
      Object.assign(res.counts, { units: units.length, lessons: nLessons, items: nItems, peItems: nPe, figs: Object.keys(figs).length, reference: reference.length, variables: variables.length });
      if (!nItems) { res.error = "No valid questions in this pack." + (rejected.length ? " See the rejected list." : ""); return res; }
      res.ok = true;
      res.pack = { id: pid, title: trusted ? String(raw.title) : sanitizeHtml(raw.title), version: trusted ? version : sanitizeHtml(version),
        description: raw.description == null ? "" : T(raw.description), builtin: trusted, units, reference, variables,
        appName: trusted ? raw.appName : undefined, tagline: trusted ? raw.tagline : undefined };

      res.itemFigs = itemFigs;

    }

    function commit(reg, res, meta) {
      const p = res.pack;
      reg.packIds.add(p.id);
      p.units.forEach((u) => {
        Object.defineProperty(u, "_pack", { value: p.id, enumerable: false });
        reg.unitIds.add(u.id);
        u.lessons.forEach((l) => { reg.lessonIds.add(l.id); l.items.forEach((it) => reg.itemIds.add(it.id)); });
        reg.units.push(u);
      });
      reg.reference.push(...p.reference);
      reg.variables.push(...p.variables);
      Object.assign(reg.figs, res.figs);
      Object.assign(reg.itemFigs, res.itemFigs);
      reg.packs.push({ id: p.id, title: p.title, version: p.version, builtin: p.builtin, counts: res.counts,
        rejected: res.rejected, warnings: res.warnings, meta: meta || {} });
    }

    function report(label, res) {
      if (!res.ok) console.warn("[STRATA] pack " + label + " not loaded: " + res.error, res.rejected);
      res.rejected.forEach((r) => console.warn("[STRATA] pack " + label + ": skipped " + r.where + " — " + r.reason));
      res.warnings.forEach((w) => console.warn("[STRATA] pack " + label + ": " + w));
    }

    /* ---------- imported-pack storage (separate key; progress key untouched) ---------- */
    function readStore() {
      try {
        const v = JSON.parse(localStorage.getItem(PACKS_KEY) || "null");
        if (v && Array.isArray(v.packs)) return v;
      } catch (e) { console.warn("[STRATA] could not read " + PACKS_KEY + ": " + e.message); }

    let lastBuild = null;
    function build() {
      const reg = newRegistry();

        const label = (raw && raw.id) || "#" + i;
        const res = validatePack(raw, reg, { trusted: true });
        report(label, res);
        if (res.ok) commit(reg, res, { source: "built-in" });
      });
      const failedImports = [];
      readStore().packs.forEach((entry) => {
        const raw = entry && entry.data;
        const res = validatePack(raw, reg, { trusted: false });
        report((entry && entry.id) || "?", res);
        if (res.ok) commit(reg, res, { source: "imported", file: entry.file, importedAt: entry.importedAt });
        else failedImports.push({ id: entry && entry.id, title: entry && entry.title, error: res.error });
      });
      const core = window.STRATA_PACKS.find((p) => p && p.id === "core") || {};
      window.STRATA_CONTENT = { appName: core.appName || "STRATA", tagline: core.tagline || "", units: reg.units, reference: reg.reference, variables: reg.variables };
      window.STRATA_FIGS = reg.figs;
      window.STRATA_ITEM_FIGS = reg.itemFigs;
      lastBuild = { reg, failedImports };
      return lastBuild;
    }

    /** Validate an imported file's text against what is loaded now (replacing an imported pack with the same id is allowed). */
    function previewImport(text, filename) {
      const raw = parsePackText(text, filename);
      const reg = newRegistry();
      window.STRATA_PACKS.forEach((p) => { const r = validatePack(p, reg, { trusted: true }); if (r.ok) commit(reg, r); });
      const replacing = raw && typeof raw === "object" ? readStore().packs.find((e) => e.id === raw.id) : null;
      readStore().packs.forEach((e) => {
        if (replacing && e.id === replacing.id) return;
        const r = validatePack(e.data, reg, { trusted: false }); if (r.ok) commit(reg, r);
      });
      const res = validatePack(raw, reg, { trusted: false });
      return { raw, res, replacing };
    }
    function saveImport(raw, filename) {
      const store = readStore();
      const entry = { id: raw.id, title: String(raw.title), version: raw.version == null ? "1" : String(raw.version),
        file: String(filename || ""), importedAt: new Date().toISOString(), data: raw };
      const i = store.packs.findIndex((e) => e.id === raw.id);
      if (i >= 0) store.packs[i] = entry; else store.packs.push(entry);
      writeStore(store);
    }
    function removeImport(id) {
      const store = readStore();
      store.packs = store.packs.filter((e) => e.id !== id);
      writeStore(store);
    }

    /** Load the built-in pack files listed in packs/index.js with <script src> (works over file:// and http). */
    function loadBuiltinFiles(done) {
      let files = self.STRATA_PACK_FILES;
      if (!Array.isArray(files)) { console.warn("[STRATA] packs/index.js missing or invalid; loading packs/core.js only"); files = ["core.js"]; }
      files = files.filter((f) => { const ok = typeof f === "string" && FILE_RE.test(f); if (!ok) console.warn("[STRATA] ignoring bad pack file name", f); return ok; });
      let left = files.length;
      const failed = [];
      if (!left) return done(failed);
      files.forEach((f) => {
        const s = document.createElement("script");
        s.src = "packs/" + f;
        s.async = false; // keep list order
        s.onload = s.onerror = (e) => {
          if (e.type === "error") { failed.push(f); console.warn("[STRATA] could not load packs/" + f); }
          if (--left === 0) done(failed);
        };
        document.head.appendChild(s);
      });
    }

    return { PACKS_KEY, sanitizeHtml, sanitizeSvg, parsePackText, validatePack, build, previewImport, saveImport, removeImport,
      readStore, loadBuiltinFiles, get lastBuild() { return lastBuild; }, registerPack: null /* set by the app after boot */ };
  })();
  </script>
  <script>

(function () {

  function load() {

  function sectionKeyForLesson(lesson) {

  function flattenUnits(units) {

  function startLesson(id) {
    const lesson = lessonById(id);
    if (!lesson) return renderHome();

      lesson,
      index: 0,
      correct: 0,
      answers: [],
      reviewMode: false
    };
    renderQuestion();

  function shuffle(arr) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  /* ---------- answer shuffling ----------
   * Display order is picked once per question per session (so the tutor/recap show the same order)
   * and re-rolled the next time the question is shown. Grading always uses the choice id, never the position. */
  const LETTERS = ["A", "B", "C", "D", "E"];
  function shuffleOn() { return state.shuffle !== false; } // missing (old saves) = on
  function orderedChoices(item) {
    const choices = (item && item.choices) || [];
    if (!session) return choices;
    session.orders = session.orders || {};
    const key = session.index + "|" + item.id;
    let ids = session.orders[key];
    if (!ids || ids.length !== choices.length) {
      ids = choices.map((c) => c.id);
      if (shuffleOn()) ids = shuffle(ids);
      session.orders[key] = ids;
    }
    return ids.map((id) => choices.find((c) => c.id === id)).filter(Boolean);
  }
  function letterOf(item, choiceId) {
    const i = orderedChoices(item).findIndex((c) => c.id === choiceId);
    return i >= 0 ? LETTERS[i] : String(choiceId || "").toUpperCase();
  }
  // Keep letter references in explanations true after shuffling:
  //   [[b]]            -> displayed letter of the choice with id "b"
  //   "choice B", "(B)" -> B means the 2nd choice as authored; rewritten to its displayed letter
  function fixLetters(text, item) {
    if (!text || !item) return text;
    const orig = item.choices || [];
    const remap = (L) => { const c = orig[LETTERS.indexOf(L)]; return c ? letterOf(item, c.id) : L; };
    return String(text)
      .replace(/\[\[([A-Za-z0-9_-]{1,16})\]\]/g, (m, id) => (orig.some((c) => c.id === id) ? letterOf(item, id) : m))
      .replace(/\b(choices?|options?|answers?|Choices?|Options?|Answers?)(\s+)([A-E])\b/g, (m, w, sp, L) => w + sp + remap(L))
      .replace(/\(([A-E])\)/g, (m, L) => "(" + remap(L) + ")");
  }

  function startMixed() {
    const picked = [];
    pathLessons().forEach((lesson) => {
      const pool = shuffle(lesson.items || []);
      pool.slice(0, 2).forEach((it) => picked.push({ ...it, label: (lesson.title || it.label || "Concept") }));
    });
    if (!picked.length) return renderHome();
    session = {
      lesson: {
        id: "mixed-concepts",
        title: "All Topics · Conceptual",
        xp: 36,
        items: shuffle(picked),
        summary: "Two items from every conceptual lesson across the PE syllabus. PE bench items are excluded."
      },
      index: 0,
      correct: 0,
      answers: [],
      reviewMode: true,
      examMode: true
    };
    renderQuestion();
  }

  function grade(choiceId) {
    const item = session.lesson.items[session.index];
    const chosen = item.choices.find((c) => c.id === choiceId);
    const correctChoice = item.choices.find((c) => c.correct);
    const ok = !!(chosen && chosen.correct);
    session.locked = true;
    session.answers.push({ id: item.id, ok });
    if (ok) session.correct += 1;
    else {
      if (!state.missed.includes(item.id)) state.missed.push(item.id);
      save();
    }
    if (ok && session.reviewMode) {
      state.missed = state.missed.filter((id) => id !== item.id);
      save();
    }

    app.querySelectorAll(".choice").forEach((b) => {
      const id = b.getAttribute("data-choice");
      if (id === correctChoice.id) b.classList.add("correct");
      if (id === choiceId && !ok) b.classList.add("wrong");
    });

    const sheet = $("#sheet");
    sheet.className = "sheet open " + (ok ? "good" : "bad");
    sheet.innerHTML = `
      <h3>${ok ? "Solid." : "Not that one."}</h3>
      <p>${fixLetters(item.explanation, item)}</p>
      ${item.work && item.work.length ? `<ol class="work">${item.work.map((s) => `<li>${fixLetters(s, item)}</li>`).join("")}</ol>` : ""}
      ${!ok && item.miss ? `<p class="why">${fixLetters(item.miss, item)}</p>` : ""}
      ${item.fepe ? `<div class="fepe">${fixLetters(item.fepe, item)}</div>` : ""}
      <div class="check-wrap two-btns">
        <button class="btn btn-ghost" id="ask-btn" type="button">Ask about this</button>
        <button class="btn btn-primary" id="next-btn" type="button">${session.index + 1 >= session.lesson.items.length ? "See results" : "Continue"}</button>
      </div>
    `;
    $("#next-btn").addEventListener("click", () => {
      session.index += 1;
      session.locked = false;
      session.tutor = null;
      if (session.index >= session.lesson.items.length) renderComplete();
      else renderQuestion();
    });
    $("#ask-btn").addEventListener("click", () => {
      session.tutorItem = item;
      session.tutorOk = ok;
      session.tutorChoice = choiceId;
      session.tutorChat = session.tutorChat && session.tutorChatFor === item.id ? session.tutorChat : [];
      session.tutorChatFor = item.id;
      renderTutor();
    });
  }

  function renderComplete() {

    if (lesson.id !== "review") {

  function itemPack(item) {
    const correct = (item.choices || []).find((c) => c.correct) || {};
    // Letters follow the order the learner actually saw (choices may be shuffled).
    return {
      stem: item.stem || "",
      vignette: item.vignette || "",
      given: item.given || "",
      explanation: fixLetters(item.explanation || "", item),
      miss: fixLetters(item.miss || "", item),
      work: (item.work || []).map((s) => fixLetters(s, item)),
      fepe: fixLetters(item.fepe || "", item),
      correctText: correct.text || "",
      correctId: correct.id ? letterOf(item, correct.id) : "",
      choices: orderedChoices(item).map((c, i) => `${LETTERS[i]}. ${c.text}${c.correct ? "  [correct]" : ""}`)
    };
  }

  function localTutor(question, item, pickedId, wasRight) {
    const p = itemPack(item);
    const q = (question || "").toLowerCase();
    const bits = [];
    const letterHit = q.match(/\b([abcd])\b/);
    const whyWrong = /why not|what.?s wrong|incorrect|trap|distractor|instead/.test(q);
    const whatIf = /what if|suppose|if the|change|instead of|higher|lower|raise|lower the wt|water table/.test(q);
    const units = /unit|psf|pcf|lb\/ft|convert|γw|62\.4/.test(q);
    const principle = /effective|pore|total stress|drained|undrained|ka|k0|kp|gradient|consol|settlement|bearing/.test(q);

    bits.push(wasRight
      ? `You marked this correctly. The keyed answer is ${p.correctId}: ${p.correctText}.`
      : `The keyed answer is ${p.correctId}: ${p.correctText}.`);

    if (letterHit) {
      const ch = orderedChoices(item)[LETTERS.indexOf(letterHit[1].toUpperCase())];
      if (ch && !ch.correct) {
        bits.push(`Choice ${letterHit[1].toUpperCase()} (“${ch.text}”) is a distractor. ${p.miss || "It usually comes from stopping one step early — total stress, pore pressure alone, or the wrong coefficient."}`);
      } else if (ch && ch.correct) {
        bits.push(`Choice ${letterHit[1].toUpperCase()} is the keyed answer. ${p.explanation}`);
      }
    } else if (whyWrong) {
      bits.push(p.miss || "The wrong options are usually the intermediate numbers: σ before subtracting u, u by itself, or a coefficient that does not match the wall or drainage case.");
    }

    if (p.work && p.work.length) {
      bits.push("Work for this item:\n" + p.work.map((s, i) => `${i + 1}. ${s}`).join("\n"));
    }

    if (units) {
      bits.push("On the PE Civil, keep γw = 62.4 pcf unless the stem gives another value. Stresses land in psf (or ksf). Wall thrusts are lb per foot of wall. Consolidation settlements are often asked in inches — multiply feet by 12.");
    }

    if (whatIf) {
      bits.push("A ‘what if’ does not change the keyed answer, but the same machine still applies: layer total stress, compute u from the actual head (not automatically from the ground surface), then σ′ = σ − u. Raising the water table raises u more than it raises σ, so σ′ falls. Switching a non-yielding wall from Ka to K0 increases thrust. Flooding a silt trench kills suction, not true c′.");
    }

    if (principle && !whyWrong) {
      bits.push("Principles this family of items keeps using: σ′ = σ − u; below a hydrostatic WT, σ′ gains at γ′ = γsat − γw; drained strength uses c′, φ′; short-term saturated clay uses su; Ka < K0 < Kp; water on a wall is ½γw h² and is not multiplied by Ka; ic = (Gs − 1)/(1 + e); primary consolidation uses log10.");
    }

    bits.push("On this exact item: " + p.explanation);
    if (p.fepe) bits.push(p.fepe);
    bits.push("I can only be certain about this item’s given numbers. If you want a new numerical example, say the new water-table depth or height and we can reuse the same setup.");
    return bits.join("\n\n");
  }

  function tutorSystemPrompt(item, pickedId, wasRight) {
    const p = itemPack(item);
    return [
      "You are a geotechnical tutor inside STRATA, a Civil FE/PE study app.",
      "Stay on THIS item unless the user clearly asks for a variation. Do not invent NCEES affiliation or claim this is a past exam question.",
      "If you do arithmetic, show steps. Prefer US customary units (psf, pcf, ft) unless the user switches.",
      "If unsure, say so. Do not change the keyed answer.",
      "Item stem: " + p.stem,
      p.vignette ? "Scenario: " + p.vignette : "",
      p.given ? "Given: " + p.given : "",
      "Choices:\n" + p.choices.join("\n"),
      "Keyed answer: " + p.correctId + " — " + p.correctText,
      "Learner picked " + letterOf(item, pickedId) + " (" + (wasRight ? "correct" : "incorrect") + ").",
      "Official explanation: " + p.explanation,
      p.work.length ? "Worked steps:\n- " + p.work.join("\n- ") : "",
      p.miss ? "Common miss: " + p.miss : "",
      p.fepe ? "Exam note: " + p.fepe : ""
    ].filter(Boolean).join("\n");
  }

  async function askTutor(question) {
    const item = session.tutorItem;
    const log = session.tutorChat || [];
    if (state.xaiKey && location.protocol.startsWith("http")) {
      try {
        const messages = [
          { role: "system", content: tutorSystemPrompt(item, session.tutorChoice, session.tutorOk) },
          ...log.map((m) => ({ role: m.role, content: m.text })),
          { role: "user", content: question }
        ];
        const res = await fetch("https://api.x.ai/v1/chat/completions", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: "Bearer " + state.xaiKey
          },
          body: JSON.stringify({
            model: "grok-4.6",
            messages,
            temperature: 0.2
          })
        });
        if (!res.ok) throw new Error("HTTP " + res.status);
        const data = await res.json();
        const text = data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
        if (text) return { text, source: "grok" };
        throw new Error("empty");
      } catch (err) {
        return {
          text: localTutor(question, item, session.tutorChoice, session.tutorOk) +
            "\n\n(Live Grok did not respond from this page — " + err.message +
            ". Using the on-item tutor. Host the app over https and check the key in Settings.)",
          source: "local"
        };
      }
    }
    return {
      text: localTutor(question, item, session.tutorChoice, session.tutorOk),
      source: state.xaiKey ? "local" : "local"
    };
  }

  function renderTutor() {
    if (!session || !session.tutorItem) return renderHome();
    const item = session.tutorItem;
    const p = itemPack(item);
    const chat = session.tutorChat || [];
    const live = !!(state.xaiKey && location.protocol.startsWith("http"));
    const chips = [
      "Why is the keyed answer right?",
      "Why are the other choices wrong?",
      "What if the water table rises?",
      "Walk through the units."
    ];
    show("tutor", `
      ${renderTop()}
      <section class="tutor">
        <div class="tutor-head">
          <div>
            <div class="kicker">${live ? "Grok on this item" : "Discuss this item"}</div>
            <h1>Ask a follow-up</h1>
          </div>
          <button class="btn btn-ghost" id="back-item" type="button">Back to answer</button>
        </div>
        <div class="tutor-item">
          <strong>${p.stem}</strong>
          <span>Keyed: ${p.correctId}. ${p.correctText}</span>
        </div>
        <div class="tutor-log" id="tutor-log">
          ${chat.length ? chat.map((m) => `<div class="bubble ${m.role}">${escapeHtml(m.text)}</div>`).join("") : `<div class="bubble assistant">Ask about this item. I will stay on these numbers and the keyed solution.${live ? "" : " This is the on-item tutor — add an xAI API key in Settings and host the app on https to talk to Grok live."}</div>`}
        </div>
        <div class="chip-row" id="chips">
          ${chips.map((c) => `<button type="button" class="pill chip" data-q="${escapeAttr(c)}">${c}</button>`).join("")}
        </div>
        <form class="tutor-form" id="tutor-form">
          <input id="tutor-q" type="text" maxlength="400" placeholder="Ask why, or change one assumption…" autocomplete="off" />
          <button class="btn btn-primary" type="submit">Send</button>
        </form>
        <button class="btn btn-ghost" id="copy-prompt" type="button">Copy prompt for Grok</button>
      </section>
    `);
    const logEl = $("#tutor-log");
    function paint() {
      logEl.innerHTML = (session.tutorChat || []).map((m) => `<div class="bubble ${m.role}">${escapeHtml(m.text)}</div>`).join("");
      logEl.scrollTop = logEl.scrollHeight;
    }
    async function send(text) {
      const q = (text || "").trim();
      if (!q) return;
      session.tutorChat = session.tutorChat || [];
      session.tutorChat.push({ role: "user", text: q });
      paint();
      const reply = await askTutor(q);
      session.tutorChat.push({ role: "assistant", text: reply.text });
      paint();
    }
    $("#tutor-form").addEventListener("submit", (e) => {
      e.preventDefault();
      const box = $("#tutor-q");
      const val = box.value;
      box.value = "";
      send(val);
    });
    app.querySelectorAll("[data-q]").forEach((b) => b.addEventListener("click", () => send(b.getAttribute("data-q"))));
    $("#back-item").addEventListener("click", () => {
      renderQuestion();
      // re-grade visually? session.locked still true but question resets selection.
      // Better return to a recap sheet. Re-call grade path is messy.
      // Show explanation sheet again by going through a slim recap.
      showItemRecap();
    });
    $("#copy-prompt").addEventListener("click", () => {
      const blob = tutorSystemPrompt(item, session.tutorChoice, session.tutorOk) +
        "\n\nLearner question: " + ((session.tutorChat || []).filter((m) => m.role === "user").slice(-1)[0] || { text: "Explain this item." }).text;
      navigator.clipboard.writeText(blob).then(() => toast("Prompt copied. Paste it into Grok.")).catch(() => toast("Copy failed — select from Settings notes."));
    });
  }

  function showItemRecap() {
    const item = session.tutorItem;
    if (!item) return renderQuestion();
    const ok = session.tutorOk;
    const choiceId = session.tutorChoice;
    const correctChoice = item.choices.find((c) => c.correct);
    show("lesson", `
      ${renderTop()}
      <div class="lesson-top">
        <button class="back-btn" data-go="home" type="button" aria-label="Back">←</button>
        <div class="track"><span style="width:${Math.round(((session.index + 1) / session.lesson.items.length) * 100)}%"></span></div>
        <div class="stat xp" title="Progress">${session.index + 1}/${session.lesson.items.length}</div>
      </div>
      <article class="prompt-card">
        <div class="q-label">Answer recap · ${session.index + 1} / ${session.lesson.items.length}</div>
        ${item.vignette ? `<div class="vignette"><span class="vignette-label">Scenario</span>${item.vignette}</div>` : ""}
        <h2>${item.stem}</h2>
        <div class="choices">
          ${orderedChoices(item).map((c, i) => {
            const letters = LETTERS;
            const cls = c.correct ? "choice correct" : (c.id === choiceId && !ok ? "choice wrong" : "choice");
            return `<button class="${cls}" type="button" disabled><span class="choice-key">${letters[i]}</span>${c.text}</button>`;
          }).join("")}
        </div>
      </article>
      <div class="sheet open ${ok ? "good" : "bad"}" id="sheet">
        <h3>${ok ? "Solid." : "Not that one."}</h3>
        <p>${fixLetters(item.explanation, item)}</p>
        ${item.work && item.work.length ? `<ol class="work">${item.work.map((s) => `<li>${fixLetters(s, item)}</li>`).join("")}</ol>` : ""}
        ${!ok && item.miss ? `<p class="why">${fixLetters(item.miss, item)}</p>` : ""}
        <div class="check-wrap two-btns">
          <button class="btn btn-ghost" id="ask-btn" type="button">Ask about this</button>
          <button class="btn btn-primary" id="next-btn" type="button">${session.index + 1 >= session.lesson.items.length ? "See results" : "Continue"}</button>
        </div>
      </div>
    `);
    $("#ask-btn").addEventListener("click", renderTutor);
    $("#next-btn").addEventListener("click", () => {
      session.index += 1;
      session.locked = false;
      session.tutor = null;
      if (session.index >= session.lesson.items.length) renderComplete();
      else renderQuestion();
    });
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/\n/g, "<br>");
  }
  function escapeAttr(s) {
    return String(s).replace(/&/g, "&amp;").replace(/"/g, "&quot;");
  }

  /* ---------- Settings › Question packs (import / list / remove) ---------- */
  const esc = (v) => escapeHtml(v == null ? "" : v);
  function countsText(c) {
    const pl = (n, w) => n + " " + w + (n === 1 ? "" : "s");
    return [pl(c.units, "unit"), pl(c.lessons, "lesson"), pl(c.items, "question") + (c.peItems ? " (" + c.peItems + " PE bench)" : ""),
      c.figs ? pl(c.figs, "figure") : "", c.reference ? pl(c.reference, "reference card") : "", c.variables ? pl(c.variables, "glossary entry").replace("entrys", "entries") : ""]
      .filter(Boolean).join(" · ");
  }
  function issuesHtml(res) {
    const rej = res.rejected || [], warn = res.warnings || [];
    return (rej.length ? `<div class="issue-head">Rejected (${rej.length})</div><ul class="issues">${rej.map((r) => `<li><code>${esc(r.where)}</code> — ${esc(r.reason)}</li>`).join("")}</ul>` : "") +
      (warn.length ? `<div class="issue-head">Warnings (${warn.length})</div><ul class="issues">${warn.map((w) => `<li>${esc(w)}</li>`).join("")}</ul>` : "");
  }
  function packsSectionHtml(flash) {
    const b = window.STRATA.lastBuild || { reg: { packs: [] }, failedImports: [] };
    const rows = b.reg.packs.map((p) => `
      <div class="pack-row" data-pack="${esc(p.id)}">
        <div class="pack-main">
          <strong>${p.title}</strong> <span class="pack-ver">v${p.version}</span>
          <span class="pack-badge ${p.builtin ? "builtin" : "imported"}">${p.builtin ? "Built-in" : "Imported"}</span>
          <div class="pack-sub">${esc(countsText(p.counts))}${p.meta && p.meta.file ? " · " + esc(p.meta.file) : ""}${(p.rejected.length ? " · " + p.rejected.length + " item(s) skipped" : "")}</div>
        </div>
        ${p.builtin ? "" : `<button class="btn btn-ghost btn-small" type="button" data-remove-pack="${esc(p.id)}">Remove</button>`}
      </div>`).join("");
    const broken = (b.failedImports || []).map((f) => `
      <div class="pack-row broken">
        <div class="pack-main"><strong>${esc(f.title || f.id)}</strong> <span class="pack-badge bad">Not loaded</span><div class="pack-sub">${esc(f.error)}</div></div>
        <button class="btn btn-ghost btn-small" type="button" data-remove-pack="${esc(f.id)}">Remove</button>
      </div>`).join("");
    return `
      <section class="splash settings-block" id="packs-section">
        <div class="kicker">Content</div>
        <h1>Question packs</h1>
        <p class="lede">Built-in packs ship with the app. Import a pack file (<code>.json</code> or <code>.js</code> pack) to add units and lessons. Imported packs are saved in this browser and load on every start.</p>
        <div class="pack-list">${rows}${broken}</div>
        <input type="file" id="pack-file" accept=".json,.js,application/json,text/javascript" hidden />
        <div class="cta-row" style="margin-top:16px">
          <button class="btn btn-primary" id="import-pack" type="button">Import pack…</button>
        </div>
        <div id="import-result" class="import-result${flash ? " show " + flash.kind : ""}" role="status">${flash ? flash.html : ""}</div>
      </section>`;
  }
  function importResultHtml(kind, title, body) {
    return { kind, html: `<h3>${title}</h3>${body || ""}` };
  }
  async function importPackFile(file) {
    if (!file) return;
    let text;
    if (file.size > 2 * 1024 * 1024) return renderSettings(importResultHtml("bad", "Import failed", `<p>${esc(file.name)} is larger than 2 MB.</p>`));
    try { text = await file.text(); }
    catch (e) { return renderSettings(importResultHtml("bad", "Import failed", `<p>Could not read ${esc(file.name)}: ${esc(e.message)}</p>`)); }
    let pv;
    try { pv = window.STRATA.previewImport(text, file.name); }
    catch (e) { return renderSettings(importResultHtml("bad", "Import failed", `<p>${esc(file.name)}: ${esc(e.message)}</p>`)); }
    const res = pv.res;
    if (!res.ok) {
      return renderSettings(importResultHtml("bad", "Import failed", `<p>${esc(file.name)}: ${esc(res.error)}</p>${issuesHtml(res)}`));
    }
    if (pv.replacing && !window.confirm(`Replace the imported pack “${pv.replacing.title}” (v${pv.replacing.version}) with this file (v${pv.raw.version == null ? "1" : pv.raw.version})?`)) {
      return renderSettings(importResultHtml("bad", "Import cancelled", `<p>The existing pack was kept.</p>`));
    }
    try { window.STRATA.saveImport(pv.raw, file.name); }
    catch (e) { return renderSettings(importResultHtml("bad", "Import failed", `<p>Could not save the pack in this browser (${esc(e.name || e.message)}). Storage may be full.</p>`)); }
    rebuildContent();
    const first = res.pack.units[0] && res.pack.units[0].lessons[0];
    renderSettings(importResultHtml("good", `${pv.replacing ? "Updated" : "Imported"} “${res.pack.title}” <span class="pack-ver">v${res.pack.version}</span>`,
      `<p>Added ${esc(countsText(res.counts))}.</p>${issuesHtml(res)}
       <div class="cta-row" style="margin-top:12px">
         ${first ? `<button class="btn btn-primary" type="button" data-start-lesson="${esc(first.id)}">Start “${first.title}”</button>` : ""}
         <button class="btn btn-ghost" type="button" data-go="home">See it on the path</button>
       </div>`));
  }
  function bindPacksSection() {
    const input = $("#pack-file");
    $("#import-pack").addEventListener("click", () => input.click());
    input.addEventListener("change", () => { const f = input.files && input.files[0]; input.value = ""; importPackFile(f); });
    app.querySelectorAll("[data-remove-pack]").forEach((btn) => btn.addEventListener("click", () => {
      const id = btn.getAttribute("data-remove-pack");
      const entry = window.STRATA.readStore().packs.find((e) => e.id === id);
      const name = entry ? entry.title : id;
      if (!window.confirm(`Remove the pack “${name}”?\n\nIts lessons disappear from the path. Your saved progress on them is kept and comes back if you import the pack again.`)) return;
      try { window.STRATA.removeImport(id); }
      catch (e) { return renderSettings(importResultHtml("bad", "Remove failed", `<p>${esc(e.message)}</p>`)); }
      rebuildContent();
      renderSettings(importResultHtml("good", "Pack removed", `<p>“${esc(name)}” was removed.</p>`));
    }));
    app.querySelectorAll("[data-start-lesson]").forEach((btn) => btn.addEventListener("click", () => startLesson(btn.getAttribute("data-start-lesson"))));
  }

  function renderSettings(flash) {
    show("settings", `
      ${renderTop()}
      <section class="splash settings-block">
        <div class="kicker">Settings</div>
        <h1>Practice</h1>
        <label class="toggle-row" for="shuffle-toggle">
          <input type="checkbox" id="shuffle-toggle" ${shuffleOn() ? "checked" : ""} />
          <span class="toggle-ui" aria-hidden="true"></span>
          <span class="toggle-copy"><strong>Shuffle answer choices</strong><span>Mix the A–D order each time a question is shown, so you learn the answer and not its position. Grading is unaffected.</span></span>
        </label>
      </section>
      ${packsSectionHtml(flash)}
      <section class="splash settings-block">
        <div class="kicker">Discussion</div>
        <h1>Ask-about-this</h1>
        <p class="lede">Every item already has an on-device tutor that stays on the keyed solution. To talk to Grok live, add an xAI API key and open the app over https (the PWA), not as a local file.</p>
        <label class="settings-label" for="xai-key">xAI API key</label>
        <input class="settings-input" id="xai-key" type="password" placeholder="xai-…" value="${state.xaiKey ? "••••••••" : ""}" />
        <p class="fineprint">Stored only in this browser. The key is sent to api.x.ai when you ask a live question. Leave blank to keep the on-device tutor. Get a key at console.x.ai.</p>
        <div class="cta-row" style="margin-top:16px">
          <button class="btn btn-primary" id="save-key" type="button">Save</button>
          <button class="btn btn-ghost" id="clear-key" type="button">Clear key</button>
          <button class="btn btn-ghost" data-go="home" type="button">Back</button>
        </div>
      </section>
    `);
    bindPacksSection();
    if (flash) { const r = $("#import-result"); if (r && r.scrollIntoView) r.scrollIntoView({ block: "center" }); }
    $("#shuffle-toggle").addEventListener("change", (e) => {
      state.shuffle = !!e.target.checked; // new optional field in strata-fepe-v1 (missing = on)
      save();
      toast(state.shuffle ? "Answer choices will be shuffled." : "Answer choices stay in authored order.");
    });
    $("#save-key").addEventListener("click", () => {
      const v = $("#xai-key").value.trim();
      if (v && !v.startsWith("•")) state.xaiKey = v;
      save();
      toast(state.xaiKey ? "Key saved on this device." : "No new key typed.");
    });
    $("#clear-key").addEventListener("click", () => {
      state.xaiKey = "";
      save();
      $("#xai-key").value = "";
      toast("Key removed.");
    });
  }


  /* ---------- boot: load built-in pack files, merge them + imported packs, then render ---------- */
  let booted = false;
  function rebuildContent() {
    const b = window.STRATA.build();
    C = window.STRATA_CONTENT;
    return b;
  }
  // Late registration (e.g. a pack script added after start-up): merge and refresh.
  window.STRATA.registerPack = function (pack) {
    Array.prototype.push.call(window.STRATA_PACKS, pack);
    if (booted) { rebuildContent(); if (app.dataset.screen === "home") renderHome(); }
  };
  window.STRATA.loadBuiltinFiles(() => {
    rebuildContent();
    booted = true;
    window.STRATA_PACKS.push = function (...packs) { packs.forEach((p) => window.STRATA.registerPack(p)); return this.length; };
    if (!C.units.length) {
      show("error", `${renderTop()}<section class="splash"><h1>No questions loaded.</h1><p class="lede">The question packs in <code>packs/</code> could not be loaded. Check that the <code>packs</code> folder sits next to index.html.</p></section>`);
      return;
    }
    regenerateHearts();
    if (!state.seenSplash) renderSplash();
    else renderHome();
  });
})();

  
  
  
  
  </script>
  <script>
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) {
    window.addEventListener("load", function () {
      navigator.serviceWorker.register("sw.js").catch(function () {});
    });
  }
  </script>
</body>
</html>
